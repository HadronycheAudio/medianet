# 004-02 fixture schema, revision 1 (tester's contract; see tests/wire_tables.rs).
schema = 1
offset_unit = "bits"
width_unit = "bits"
size_unit = "bytes"

# AC 2 negative fixture 4 of 5: an undeclared gap.
# `header` covers bits 0..8 and `body` covers bits 16..24: bits 8..16 are
# occupied by no field and no `pad` field declares them. The union reaches
# byte 3 and the declared maximum size matches, so only the gap must fire.
[[message]]
name = "gap"
layer = "control"
dscp = 40
max_size = 3
rejection_reasons = ["BadLength"]

[[message.field]]
name = "header"
offset = 0
width = 8
type = "u8"
meaning = "tester fixture field"
valid = "0 to 255"

[[message.field]]
name = "body"
offset = 16
width = 8
type = "u8"
meaning = "tester fixture field, leaving an undeclared gap at bits 8..16"
valid = "0 to 255"
