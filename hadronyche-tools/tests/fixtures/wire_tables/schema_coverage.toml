# 004-02 fixture schema, revision 1 (tester's contract; see tests/wire_tables.rs).
schema = 1
offset_unit = "bits"
width_unit = "bits"
size_unit = "bytes"

# AC 1 positive fixture: the schema-coverage file. It is tiny but exercises
# every schema feature that ticket 004-02 Work steps 1-2 name:
#   - sub-byte fields: the 2-bit copy index (C-07) and a 6-bit flags field;
#   - widths 8, 16, 32, 64 and 128 bits;
#   - a 4-byte sample (C-03), f32;
#   - counted lists with a maximum: 32 bundle members (C-08) and 64 peers
#     (C-34), each as a count field plus a list field;
#   - the "section of" attribute (this message is a regime stamp section);
#   - per-message maximum size, layer, DSCP and rejection-reason list;
#   - declared padding, so the gap rule has a positive case.
# The checker must accept the file and report both messages. The section's
# size is 232 bytes, computed with the two maximum counts.
[[message]]
name = "regime_stamp"
layer = "control"
dscp = 40
max_size = 3
rejection_reasons = ["TooShort"]

[[message.field]]
name = "version"
offset = 0
width = 16
type = "u16"
meaning = "stamp version (placeholder for 004-24)"
valid = "0 to 65535"

[[message.field]]
name = "section_count"
offset = 16
width = 8
type = "u8"
meaning = "number of sections (placeholder for 004-24)"
valid = "0 to 255"

[[message]]
name = "coverage_section"
layer = "control"
dscp = 40
max_size = 232
section_of = "regime_stamp"
rejection_reasons = ["TooShort", "BadLength", "ReservedNonZero"]

[[message.field]]
name = "copy_index"
offset = 0
width = 2
type = "uint"
meaning = "copy index (C-07)"
valid = "0 to 3"

[[message.field]]
name = "flags"
offset = 2
width = 6
type = "uint"
meaning = "flags, including gap and degraded"
valid = "0 to 63"
reserved = "0"

[[message.field]]
name = "stream_number"
offset = 8
width = 8
type = "u8"
meaning = "an 8-bit field"
valid = "0 to 255"

[[message.field]]
name = "session"
offset = 16
width = 16
type = "u16"
meaning = "a 16-bit field (C-10)"
valid = "0 to 65535"

[[message.field]]
name = "sequence"
offset = 32
width = 32
type = "u32"
meaning = "a 32-bit field"
valid = "0 to 4294967295"

[[message.field]]
name = "module_id"
offset = 64
width = 64
type = "u64"
meaning = "a 64-bit field (C-11)"
valid = "0 to 18446744073709551615"

[[message.field]]
name = "auth_tag"
offset = 128
width = 128
type = "u128"
meaning = "a 128-bit field (C-12)"
valid = "0 to 340282366920938463463374607431768211455"

[[message.field]]
name = "sample"
offset = 256
width = 32
type = "f32"
meaning = "one 4-byte sample (C-03)"
valid = "any f32"

[[message.field]]
name = "member_count"
offset = 288
width = 8
type = "u8"
meaning = "bundle member count (C-08)"
valid = "0 to 32"

[[message.field]]
name = "members"
offset = 296
width = 16
type = "u16"
meaning = "bundle member entry"
valid = "0 to 65535"
count = "member_count"
max_count = 32

[[message.field]]
name = "peer_count"
offset = 808
width = 8
type = "u8"
meaning = "active-module peer count (C-34)"
valid = "0 to 64"

[[message.field]]
name = "peers"
offset = 816
width = 16
type = "u16"
meaning = "peer entry"
valid = "0 to 65535"
count = "peer_count"
max_count = 64

[[message.field]]
name = "padding"
offset = 1840
width = 16
type = "pad"
meaning = "declared zero padding to the byte boundary"
valid = "0"
