[package]
name = "hadronyche-tools"
version.workspace = true
edition.workspace = true
# Generates the registry of ported document checks from src/doccheck/checks/
# (one file per port, so porters working in parallel never edit a shared list).
build = "build.rs"

[dependencies]
# Document checks (src/doccheck): the scripts being ported are written in
# Python regular expressions; the standard regex crate keeps each pattern
# readable and reviewable one for one, instead of hand-written matchers.
regex = "1"
# Ticket 004-02: the standard TOML library (the ticket's default), so the
# checker's file parser is not hand-written and needs no fuzzing under C-95.
toml = "0.9"
# Ticket 007a-03: the vector reader is the fuzz target `vector-reader-fuzz`.
hadronyche-vectors = { path = "../hadronyche-vectors" }

[[bin]]
name = "gen"
path = "src/bin/gen.rs"
