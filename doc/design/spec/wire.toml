# Hello (ticket 004-16): wire.md's "Hello" section is the human-readable
# authority. The first seven fields are the 32-byte common control header
# that every control message starts with (004-17, 004-18, 004-24, 004-27 and
# 004-29 reuse it); the message type is scoped to the control layer, and the
# hello is code 1. Field names follow the markdown Meaning labels. The fixed
# part is 76 bytes (three counts included); the name is one byte counted by
# name_length, max_count = 32; the port elements are one 56-bit element
# counted by port_count, max_count = 51; the bundle elements are one 784-bit
# element counted by bundle_count, max_count = 8. The schema has no struct or
# blob type, so the elements are declared "uint" (the receiver report
# member's precedent), with their own layouts in the [[message]] tables
# "hello port element" and "hello bundle element" below. max_size =
# 76 + 32 + 51 x 7 + 8 x 98 = 1 249 bytes, within the 1 252-byte control
# bound; a source with one 32-member bundle is 563 bytes at the name and
# port maxima.

[[message]]
name = "hello"
layer = "control"
dscp = 40
max_size = 1249
rejection_reasons = ["TooShort", "BadMagic", "VersionMismatch", "BadLength", "UnconfiguredDomain", "ForeignDomain", "OversizeControl", "ReservedNonZero"]

[[message.field]]
name = "magic"
offset = 0
width = 16
type = "u16"
meaning = "magic 0x4d4e, the ASCII letters M and N, fixed by 004-04"
valid = "0x4d4e only"

[[message.field]]
name = "protocol_version"
offset = 16
width = 16
type = "u16"
meaning = "protocol version, major in bits 15..8, minor in bits 7..0; v1 packs 1.0 as 0x0100 (004-04)"
valid = "major 1, any minor; senders write 0x0100"

[[message.field]]
name = "domain_id"
offset = 32
width = 16
type = "u16"
meaning = "domain id (C-11); 0 is the unconfigured domain"
valid = "1 to 65535; 0 = unconfigured, ignored and counted as UnconfiguredDomain (C-173)"

[[message.field]]
name = "message_type"
offset = 48
width = 8
type = "u8"
meaning = "message type, scoped to the control layer: 1 = hello"
valid = "1 only"

[[message.field]]
name = "authentication_scheme"
offset = 56
width = 8
type = "u8"
meaning = "authentication scheme (C-12); 0 = none in v1 (C-115)"
valid = "0 only"
reserved = "0"

[[message.field]]
name = "message_counter"
offset = 64
width = 64
type = "u64"
meaning = "message counter (C-12): live (C-115), the sender's data-plane liveness counter; it rises with each control message while the data plane makes progress and stands still while it does not"
valid = "any 64-bit value"

[[message.field]]
name = "authentication_tag"
offset = 128
width = 128
type = "u128"
meaning = "authentication tag (C-12): 128 zero bits in v1 (C-115)"
valid = "0 only"
reserved = "0"

[[message.field]]
name = "module_id"
offset = 256
width = 64
type = "u64"
meaning = "module id (C-11) of the sender"
valid = "any 64-bit value"

[[message.field]]
name = "instance_nonce"
offset = 320
width = 64
type = "u64"
meaning = "instance nonce (C-11): drawn afresh each time the module starts"
valid = "any 64-bit value"

[[message.field]]
name = "capability_bits"
offset = 384
width = 32
type = "u32"
meaning = "capability bits: holder-eligible is bit 0 (ADR 14); bits 1 to 31 are unassigned in v1"
valid = "any 32-bit value; senders write 0 in bits 1 to 31, and receivers ignore them"

[[message.field]]
name = "election_epoch"
offset = 416
width = 32
type = "u32"
meaning = "election epoch: the highest election epoch this module has seen; 0 = no election seen yet; compared unsigned, higher wins"
valid = "any 32-bit value"

[[message.field]]
name = "believed_holder"
offset = 448
width = 64
type = "u64"
meaning = "believed holder: the module id (C-11) of the holder this module follows in its election epoch"
valid = "any 64-bit value; written 0 and ignored while the election epoch is 0"

[[message.field]]
name = "time_state"
offset = 512
width = 8
type = "u8"
meaning = "time state: 0 = time unusable (acquiring, or Unlocked, C-162), 1 = holdover with the alignment claim not lapsed, 2 = Locked (C-213, C-221)"
valid = "0 to 2; a receiver reads a value above 2 as 0"

[[message.field]]
name = "timeline_epoch"
offset = 520
width = 16
type = "u16"
meaning = "timeline epoch (C-10): the timeline epoch this module is on"
valid = "any 16-bit value"

[[message.field]]
name = "transport_role"
offset = 536
width = 8
type = "u8"
meaning = "transport role, a proposal for epic 005: 0 = none, 1 = follower, 2 = reference"
valid = "0 to 2; a receiver reads a value above 2 as none"

[[message.field]]
name = "alarm_field"
offset = 544
width = 8
type = "u8"
meaning = "alarm field: bit 0 refusal, bit 1 interrupted, bit 2 dead, bit 3 demoted, bit 4 cannot-meet-A, bit 5 control-degraded (C-173, C-174, C-139); a bit is 1 while that alarm is raised"
valid = "any value; senders write 0 in bits 7..6, and receivers ignore them"

[[message.field]]
name = "regime_stamp_version_number"
offset = 552
width = 32
type = "u32"
meaning = "regime stamp version number (C-18): incremented modulo 2^32 on every change of the sender's stamp; a copy is stale when the (instance nonce, version number) pair differs"
valid = "any 32-bit value"

[[message.field]]
name = "name_length"
offset = 584
width = 8
type = "u8"
meaning = "name length: how many bytes of name follow the bundle count"
valid = "1 to 32; 0 or above 32 is BadLength"

[[message.field]]
name = "port_count"
offset = 592
width = 8
type = "u8"
meaning = "port count: how many port elements follow the name"
valid = "0 to 51; above 51 is BadLength"

[[message.field]]
name = "bundle_count"
offset = 600
width = 8
type = "u8"
meaning = "bundle count: how many bundle elements follow the port elements"
valid = "0 to 8; above 8 is BadLength"

[[message.field]]
name = "name"
offset = 608
width = 8
type = "u8"
meaning = "name: the module's name, UTF-8 (RFC 3629), compared byte for byte"
valid = "name_length bytes, at most 32; bytes that are not valid UTF-8 are BadLength"
count = "name_length"
max_count = 32

[[message.field]]
name = "port"
offset = 864
width = 56
type = "uint"
meaning = "one port element, laid out as the [[message]] hello port element below: port id 1 byte, direction bit and 7 unassigned bits, content-type count 1 byte, then at most 4 content-type codes; 3 + content-type count bytes, at most 7; elements back to back with no separator"
valid = "port_count elements, at most 51 (357 bytes); each with 1 to 4 content types; port ids distinct"
count = "port_count"
max_count = 51

[[message.field]]
name = "bundle"
offset = 3720
width = 784
type = "uint"
meaning = "one bundle element, laid out as the [[message]] hello bundle element below: group id 1 byte, member count 1 byte, member list of 1-byte stream numbers, then the channel map of 2-byte channel counts; 2 + 3 x member count bytes, at most 98; elements back to back with no separator"
valid = "bundle_count elements, at most 8 (784 bytes); each with 1 to 32 members (C-08); group ids distinct"
count = "bundle_count"
max_count = 8

[[message]]
name = "hello port element"
layer = "control"
dscp = 40
max_size = 7
rejection_reasons = ["BadLength"]

[[message.field]]
name = "port_id"
offset = 0
width = 8
type = "u8"
meaning = "port id: the port's index in the module's port list in its manifest (004-26)"
valid = "0 to 255; distinct within one hello, or BadLength"

[[message.field]]
name = "direction"
offset = 8
width = 1
type = "uint"
meaning = "direction, bit 0 of byte 1: 0 = input, 1 = output"
valid = "0 or 1"

[[message.field]]
name = "unassigned"
offset = 9
width = 7
type = "uint"
meaning = "unassigned, bits 7..1 of byte 1: senders write zero, and receivers ignore them"
valid = "any value"

[[message.field]]
name = "content_type_count"
offset = 16
width = 8
type = "u8"
meaning = "content-type count: how many content types the port carries"
valid = "1 to 4; 0 or above 4 is BadLength"

[[message.field]]
name = "content_type"
offset = 24
width = 8
type = "u8"
meaning = "content type: a content-message kind code (0 audio, 1 dense controllers, 2 sparse keyed controllers, 3 transport state), each at most once per port"
valid = "content_type_count codes, at most 4; a code above 3 is ignored; a code twice is BadLength"
count = "content_type_count"
max_count = 4

[[message]]
name = "hello bundle element"
layer = "control"
dscp = 40
max_size = 98
rejection_reasons = ["BadLength"]

[[message.field]]
name = "group_id"
offset = 0
width = 8
type = "u8"
meaning = "group id: the bundle's identity within its source, as the manifest declares it; this width is proposed by 004-16 and confirmed by 004-26"
valid = "0 to 255; distinct among the source's bundles"

[[message.field]]
name = "member_count"
offset = 8
width = 8
type = "u8"
meaning = "member count: how many members the bundle has, the controller member included (C-08, C-209)"
valid = "1 to 32; 0 or above 32 is BadLength"

[[message.field]]
name = "member"
offset = 16
width = 8
type = "u8"
meaning = "member list: the stream number (C-10) of each member at the source, one byte because every valid stream number is 0 to 255 (C-09)"
valid = "member_count entries, at most 32; 0 to 255, distinct"
count = "member_count"
max_count = 32

[[message.field]]
name = "channel_count"
offset = 272
width = 16
type = "u16"
meaning = "channel map: the channel count of each member, in member-list order; 0 marks the controller member (C-205); it follows the member list directly on the wire"
valid = "member_count entries, at most 32; 0 for at most one member, otherwise 1 to 16 383 (1 to 341 at the default 48 frames)"
count = "member_count"
max_count = 32

# The election messages (ticket 004-17): wire.md's "Election messages" section
# is the authority. Both start with the 32-byte common control header of the
# hello (004-16); the message type is scoped to the control layer, and 004-17
# assigns codes 2 (candidacy) and 3 (holder announcement) from its block 2 to
# 15. Field names follow the markdown Meaning labels. Both messages have a
# fixed size: candidacy 66 bytes, holder announcement 55 bytes, far within the
# 1 252-byte control bound (C-17). No field is a timer: listen-before-claim
# (C-32), the election window (C-33) and the reply-silence trigger (C-37) are
# behaviour of epic 005.

[[message]]
name = "candidacy"
layer = "control"
dscp = 40
max_size = 66
rejection_reasons = ["TooShort", "BadMagic", "VersionMismatch", "BadLength", "UnconfiguredDomain", "ForeignDomain", "OversizeControl", "ReservedNonZero"]

[[message.field]]
name = "magic"
offset = 0
width = 16
type = "u16"
meaning = "magic 0x4d4e, the ASCII letters M and N, fixed by 004-04"
valid = "0x4d4e only"

[[message.field]]
name = "protocol_version"
offset = 16
width = 16
type = "u16"
meaning = "protocol version, major in bits 15..8, minor in bits 7..0; v1 packs 1.0 as 0x0100 (004-04)"
valid = "major 1, any minor; senders write 0x0100"

[[message.field]]
name = "domain_id"
offset = 32
width = 16
type = "u16"
meaning = "domain id (C-11); 0 is the unconfigured domain"
valid = "1 to 65535; 0 = unconfigured, ignored and counted as UnconfiguredDomain (C-173)"

[[message.field]]
name = "message_type"
offset = 48
width = 8
type = "u8"
meaning = "message type, scoped to the control layer: 2 = candidacy"
valid = "2 only"

[[message.field]]
name = "authentication_scheme"
offset = 56
width = 8
type = "u8"
meaning = "authentication scheme (C-12); 0 = none in v1 (C-115)"
valid = "0 only"
reserved = "0"

[[message.field]]
name = "message_counter"
offset = 64
width = 64
type = "u64"
meaning = "message counter (C-12): live (C-115), the sender's data-plane liveness counter, shared with its hellos"
valid = "any 64-bit value"

[[message.field]]
name = "authentication_tag"
offset = 128
width = 128
type = "u128"
meaning = "authentication tag (C-12): 128 zero bits in v1 (C-115)"
valid = "0 only"
reserved = "0"

[[message.field]]
name = "module_id"
offset = 256
width = 64
type = "u64"
meaning = "module id (C-11) of the sender"
valid = "any 64-bit value"

[[message.field]]
name = "instance_nonce"
offset = 320
width = 64
type = "u64"
meaning = "instance nonce (C-11) of the sender: the nonce its hellos carry (C-46)"
valid = "any 64-bit value"

[[message.field]]
name = "election_epoch"
offset = 384
width = 32
type = "u32"
meaning = "election epoch: the election this candidacy opens or joins; compared unsigned, as in the hello"
valid = "1 to 4 294 967 295; 0 is BadLength (provisional, 004-21)"

[[message.field]]
name = "believed_holder"
offset = 416
width = 64
type = "u64"
meaning = "believed holder: the module id (C-11) of the holder the sender followed, or was, when it entered this election; its own module id when it was that holder"
valid = "any 64-bit value; written 0 and ignored when the believed holder epoch is 0"

[[message.field]]
name = "believed_holder_epoch"
offset = 480
width = 32
