# Machine-readable wire tables — schema revision 1 (ticket 004-02).
#
# This file is the machine-readable form of the field tables in
# `doc/design/spec/wire.md` (C-130). Task 007 (conformance) generates its test
# vectors from it; tasks 009 to 014 implement the layouts it describes. The
# checker `hadronyche-tools::wire_tables::check_file` (C-133) verifies it in
# CI, unprivileged: parse, round-trip, field coverage, declared versus
# computed maximum size, the 1 252-byte control bound (C-17, C-116), and —
# from ticket 004-03 — that every `rejection_reasons` entry is a member of
# the closed `Reject` enumeration declared below. From ticket 004-05 the
# `[[reserved]]` entries below carry the reserved fields' required v1
# values, which the checker parses and round-trips.
#
# # Schema, revision 1
#
# Top level (the four unit keys are required, exactly these units; the
# optional `reject` array of tables, from ticket 004-03, is the fifth
# top-level key, and the optional `reserved` array of tables, from ticket
# 004-05, is the sixth):
#
#   schema       = 1        integer schema revision; this file is revision 1.
#   offset_unit  = "bits"   every field `offset` is a bit position counted
#                           from bit 0 of the message start.
#   width_unit   = "bits"   every field `width` is a bit count. For a counted
#                           field (see `count`) the width is the width of ONE
#                           element; the field occupies width * max_count bits.
#   size_unit    = "bytes"  every `max_size` is a byte count.
#
# Per rejection reason, one `[[reject]]` table (ticket 004-03), in value
# order; together the entries are the closed `Reject` enumeration of
# wire.md's "Rejection reasons" section:
#
#   name    = "..."   the variant name, unique, non-empty, CamelCase as in
#                     wire.md.
#   value   = N        the variant's u8 value, unique, 0..=255. The values are
#                     stable across minor versions; the enumeration is closed
#                     within a major version, with values 13..=255 reserved
#                     for a future major version [decision].
#   meaning = "..."   the one-line meaning, as in wire.md.
#
# The array is optional (the 004-02 fixtures predate it); the canonical file
# declares it. When present it must declare exactly the closed set pinned by
# the checker, name-for-name and value-for-value — the enumeration is
# closed, so a file cannot redefine it — and every entry of a message's
# `rejection_reasons` must name a member.
#
# Per reserved field, one `[[reserved]]` table (ticket 004-05), in wire.md's
# "Reserved fields" order; together the entries are that section, which is
# the human-readable authority the file must agree with:
#
#   name    = "..."   unique, non-empty field name, as in wire.md.
#   message = "..."   where the field lives (message and the ticket that
#                     places it).
#   width   = N       bit count.
#   value   = ...     the required v1 value: an integer (e.g. 0) or free
#                     text ("zero", "live").
#   live    = true     optional, only for a live field (C-115): the field is
#                     live in v1, not a reserved zero field, so it carries
#                     any value and never produces ReservedNonZero. A live
#                     field cannot also be fixed at 0.
#   meaning = "..."   the required v1 value, as in wire.md.
#   outcome = "..."   the receiver outcome on a non-conforming value.
#
# The array is optional; the canonical file declares it. The general rule of
# wire.md's section is stated here once for the file too: senders zero every
# padding and reserved bit a later ticket adds, and receivers drop and count
# a non-zero value as ReservedNonZero.
#
# The protocol version fields (ticket 004-04), one `[versioning]` table: the
# machine-readable copy of wire.md's "Versioning" section, which states the
# rules; the two must agree value for value. The checker does not model this
# table (versioning rules are wire.md's to state; the fields belong to the
# per-message tables that 004-06 onward add), but the conformance task 007
# generates from it:
#
#   magic         = 0x4d4e  the 2-byte magic of every message, at offset 0;
#                           distinct in both bytes from the retired POC's
#                           0x4844 [decision].
#   magic_width   = 2       the magic's width in bytes.
#   version_width = 2       the version field's width in bytes, at offset 2.
#   major         = 1       v1's major: the high byte of the version u16
#                           (bits 15..8) [decision].
#   minor         = 0       v1's minor: the low byte of the version u16
#                           (bits 7..0) [decision].
#   version       = 0x0100  v1's packed value, major << 8 | minor.

# Per message, one `[[message]]` table; `name` is unique and non-empty:
#
#   name         = "..."    unique, non-empty message name.
#   layer        = "..."    one of "control", "sync", "media", "measurement".
#   dscp         = N        the DiffServ codepoint, an integer 0..=63.
#   max_size     = N        the declared maximum size in bytes. Every message
#                           has a fixed maximum, because a `no_std` core crate
#                           parses it without allocation and in bounded time
#                           [decision].
#                           (The deprecated spelling `maximum_size` is still
#                           accepted by the parser, but the canonical writer
#                           emits `max_size`, so a file using the deprecated
#                           spelling fails the round-trip check; use
#                           `max_size`.)
#   section_of   = "..."    optional: this message is a section of the named
#                           parent message (the regime stamp is split into
#                           sections that each fit the control bound, C-18).
#   exempt_from_control_bound = "C-116"
#                           optional: the only exemption from the 1 252-byte
#                           control bound, for the path-MTU probe pair, which
#                           is sent at the intended media packet size (C-116).
#                           Any other value is a parse error.
#   rejection_reasons = ["...", ...]
#                           the rejection reasons this message can produce, in
#                           table order. From ticket 004-03 each entry must be
#                           a member of the closed `Reject` enumeration (the
#                           `[[reject]]` tables above); the checker rejects a
#                           file whose message names a non-member.
#
# Per field, one `[[message.field]]` table inside its message; `name` is
# unique within the message, and the fields must cover the message from bit 0
# with no overlap and no undeclared gap (a `type = "pad"` field declares
# padding):
#
#   name     = "..."        unique, non-empty field name.
#   offset   = N            bit position from the message start (bits).
#   width    = N            bit count (bits); the field occupies
#                           [offset, offset + width), or
#                           [offset, offset + width * max_count) when `count`
#                           is present.
#   type     = "..."        one of:
#                             "uint"   sub-byte unsigned integer (e.g. the
#                                      2-bit copy index, C-07);
#                             "u8" "u16" "u32" "u64" "u128"
#                                      fixed-width unsigned integers
#                                      (C-10, C-11, C-12);
#                             "i8" "i16" "i32" "i64" "i128"
#                                      fixed-width signed integers;
#                             "f32"    one 4-byte sample (C-03);
#                             "q1.31"  Q1.31 fixed-point sample;
#                             "pad"    declared padding (zero bits on the
#                                      wire); a pad field is what makes an
#                                      otherwise undeclared gap legal.
#   meaning  = "..."        what the field carries.
#   valid    = "..."        the valid range, free text (e.g. "0 to 255").
#   reserved = "..."        optional: the reserved value, when one exists
#                           (rules for reserved fields are ticket 004-05).
#   count    = "..."        optional: the name of the field that counts this
#                           list; `width` is then per element.
#   max_count = N           required with `count`: the list's fixed maximum
#                           (e.g. at most 32 bundle members, C-08; at most 64
#                           peers, C-34). This is how the maximum message size
#                           is computed from the file alone: the declared
#                           `max_size` must equal the size computed from the
#                           fields and maximum counts, which is why counted
#                           lists are encoded as a count field plus a maximum
#                           count and never as an unbounded list.
#
# The checker runs the rules in this order: parse (from ticket 004-03 this
# includes rejecting any `rejection_reasons` entry that is not a member of
# the `[[reject]]` enumeration; from ticket 004-05 it also parses the
# `[[reserved]]` entries); round-trip (re-serialise, re-parse, compare
# models, reserved entries included); field coverage (overlap, then gap);
# declared versus computed maximum size; and the 1 252-byte control bound
# for control messages and regime stamp sections, with the C-116 exemption.

schema = 1
offset_unit = "bits"
width_unit = "bits"
size_unit = "bytes"

# The closed `Reject` enumeration (ticket 004-03): the machine-readable copy
# of wire.md's "Rejection reasons" section, which is the human-readable
# authority; the two must agree name-for-name and value-for-value. The
# enumeration is closed within a major version, and values 13..=255 are
# reserved for a future major version and stay unused [decision].

[[reject]]
name = "TooShort"
value = 0
meaning = "fewer bytes than the message's fixed minimum: dropped before any field is read"

[[reject]]
name = "BadMagic"
value = 1
meaning = "the leading bytes are not the magic of any message of this major version; the magic is fixed by 004-04"

[[reject]]
name = "VersionMismatch"
value = 2
meaning = "the version field is not the version of this major version: counted like every rejection and also raises a named event (never a silent drop); the version travels in the hello, so the mismatch is found before a connection exists"

[[reject]]
name = "ForeignDomain"
value = 3
meaning = "the domain id is a non-zero domain other than this module's (C-11): dropped and counted"

[[reject]]
name = "UnconfiguredDomain"
value = 4
meaning = "the domain id is 0, the unconfigured domain (C-11): the packet is ignored and counted, not refused, and is never a ForeignDomain (C-173)"

[[reject]]
name = "UnknownStream"
value = 5
meaning = "the stream number names no stream this consumer admits; on the measurement layer, a receiver-report row whose stream number is not the member admitted to the reporting consumer at that row (Receiver report)"

[[reject]]
name = "UnadmittedSource"
value = 6
meaning = "the source's module id has no admitted connection at this consumer; on the sync layer, a reply whose holder module id is not the holder the follower follows (Sync request and reply); on the measurement layer, a receiver report whose bundle identity is not the receiving producer's module id or whose first row's stream number names no bundle admitted for the module its reporter identity names, a probe request from a module that shares no admitted connection with the responder, or a probe reply without matching fields (Receiver report, One-way probe)"

[[reject]]
name = "BadLength"
value = 7
meaning = "a declared length or count disagrees with the message's own size rules: a count above its fixed maximum, or a body that does not fill the fixed size"

[[reject]]
name = "BadChecksum"
value = 8
meaning = "the checksum does not match the recomputed value; the checksum arrives with 004-13"

[[reject]]
name = "BadPacketIndex"
value = 9
meaning = "the packet index lies outside the packet count its slice declares"

[[reject]]
name = "WrongEpoch"
value = 10
meaning = "the timeline epoch is not the consumer's current epoch (C-10): counted under this reason — the per-connection other-epoch counter (C-135, C-159) — and never a miss (C-102); on the sync layer, a reply whose epoch differs from the follower's current epoch and that answers a request sent no later than the follower adopted that epoch, counted per socket (Sync request and reply)"

[[reject]]
name = "OversizeControl"
value = 11
meaning = "a control message exceeds the 1 252-byte UDP-payload bound (C-17)"

[[reject]]
name = "ReservedNonZero"
value = 12
meaning = "a field this specification fixes at zero carries a non-zero value; the fields and their required zeros are fixed by 004-05"

# Reserved values (ticket 004-05): the machine-readable copy of wire.md's
# "Reserved fields" section, which is the human-readable authority; the two
# must agree. One [[reserved]] entry per reserved field, in wire.md order.

[[reserved]]
name = "copy_index"
message = "media packet header (C-07, placed by 004-06)"
width = 2
value = 0
meaning = "wire space kept for the deferred duplication feature: v1 senders emit 0 only, and v1 receivers accept all four values 0 to 3 [decision]"
outcome = "no value is non-conforming in v1 (receivers accept 0 to 3); dedup is by stream, position and packet index, first valid copy wins, with no separate sequence number"

[[reserved]]
name = "authentication_scheme"
message = "control messages (C-12, placed by 004-16 to 004-18) and sync messages (004-19)"
width = 8
value = 0
meaning = "0 (none) in v1 (C-115): wire space for a later authentication scheme"
outcome = "a non-zero scheme is dropped and counted as ReservedNonZero"

[[reserved]]
name = "message_counter"
message = "control messages (C-12, placed by 004-16 to 004-18) and sync messages (004-19)"
width = 64
value = "live"
live = true
meaning = "live in v1 because it is the liveness counter (C-115): it increments with every control message while the sender's data plane makes progress (004-16, Hello, Liveness counter) and is not a reserved zero field; in sync messages (004-19) it counts the sender's sync messages and is live without being the liveness counter"
outcome = "any value is conforming in v1; the counter is not a reserved zero field and never produces ReservedNonZero"

[[reserved]]
name = "authentication_tag"
message = "control messages (C-12, placed by 004-16 to 004-18) and sync messages (004-19)"
width = 128
value = "zero"
meaning = "128 zero bits in v1 (C-115)"
outcome = "a non-zero tag is dropped and counted as ReservedNonZero"

[[reserved]]
name = "capability_bits_1_to_31"
message = "hello (004-16)"
width = 31
value = 0
meaning = "unassigned capability bits: v1 senders write 0, and v1 receivers accept any value and ignore the bits [decision]"
outcome = "no value is non-conforming in v1; never ReservedNonZero"

[[reserved]]
name = "alarm_bits_7_6"
message = "hello (004-16)"
width = 2
value = 0
meaning = "unassigned alarm bits: v1 senders write 0, and v1 receivers accept any value and ignore the bits [decision]"
outcome = "no value is non-conforming in v1; never ReservedNonZero"

[[reserved]]
name = "port_element_bits_7_1"
message = "hello port element (004-16)"
width = 7
value = 0
meaning = "unassigned bits 7..1 of byte 1: v1 senders write 0, and v1 receivers accept any value and ignore the bits [decision]"
outcome = "no value is non-conforming in v1; never ReservedNonZero"

[[reserved]]
name = "transport_role_values_3_to_255"
message = "hello (004-16)"
width = 8
value = "unused"
meaning = "v1 senders write 0 to 2; values 3 to 255 are unused in v1 [decision]"
outcome = "a v1 receiver reads the value as none; never a rejection"

[[reserved]]
name = "time_state_values_3_to_255"
message = "hello (004-16)"
width = 8
value = "unused"
meaning = "v1 senders write 0 to 2; values 3 to 255 are unused in v1 [decision]"
outcome = "a v1 receiver reads the value as 0, time unusable; never a rejection"

[[reserved]]
name = "content_type_codes_4_to_255"
message = "hello port element (004-16)"
width = 8
value = "unused"
meaning = "v1 senders write content-message kind codes 0 to 3; codes 4 to 255 are unused in v1 [decision]"
outcome = "a v1 receiver ignores the code and keeps the port; never a rejection"

[[reserved]]
name = "election_time_state_values_3_to_255"
message = "candidacy and holder announcement (004-17)"
width = 8
value = "unused"
meaning = "v1 senders write 0 to 2; values 3 to 255 are unused in v1, the hello's encoding and receiver rule [decision]"
outcome = "a v1 receiver reads the value as 0, time unusable, as for the hello; never a rejection"

[[reserved]]
name = "holder_eligibility_bits_7_1"
message = "candidacy (004-17)"
width = 7
value = 0
meaning = "unassigned bits 7..1 of the holder eligibility byte: v1 senders write 0; reserved zero bits under the general rule, because a candidacy flag enters the winner function and can arrive only with a major version [decision]"
outcome = "a non-zero bit is dropped and counted as ReservedNonZero"

[[reserved]]
name = "manifest_port_element_bits_7_2"
message = "manifest port element (004-26)"
width = 6
value = 0
meaning = "reserved bits 7..2 of byte 0 of a manifest port element: v1 senders write 0; reserved zero bits under the general rule, because a manifest bit declares what a receiver must honour to admit and parse the streams [decision]"
outcome = "a non-zero bit drops the manifest, counted as ReservedNonZero"

[[reserved]]
name = "manifest_stream_element_bits_7_4"
message = "manifest stream element (004-26)"
width = 4
value = 0
meaning = "reserved bits 7..4 of byte 2 of a manifest stream element: v1 senders write 0; reserved zero bits under the general rule [decision]"
outcome = "a non-zero bit drops the manifest, counted as ReservedNonZero"

[[reserved]]
name = "manifest_join_element_bits_7_1"
message = "manifest join element (004-26)"
width = 7
value = 0
meaning = "reserved bits 7..1 of byte 4 of a manifest join element: v1 senders write 0; reserved zero bits under the general rule [decision]"
outcome = "a non-zero bit drops the manifest, counted as ReservedNonZero"

[[reserved]]
name = "manifest_content_type_codes_4_255"
message = "manifest port element (004-26)"
width = 8
value = "unused"
meaning = "v1 senders write content-message kind codes 0 to 3; codes 4 to 255 are unused in v1, the hello's code space and receiver rule [decision]"
outcome = "a v1 receiver ignores the code and keeps the port; never a rejection"

[[reserved]]
name = "regime_stamp_section_type_codes_unassigned"
message = "regime stamp section (004-24)"
width = 16
value = "unused"
meaning = "section type codes not assigned in v1 (32 to 65535, and any code of the 004-25 and 004-28 blocks they leave unassigned): v1 senders write an assigned code; an accept-any field, because adding a section type is a minor change [decision]"
outcome = "a v1 receiver skips the section's body by its section length and keeps the section for the completeness test; never a rejection"

[[reserved]]
name = "regime_stamp_health_entry_bits_7_1_of_byte_18"
message = "regime stamp health entry (004-25)"
width = 7
value = 0
meaning = "bits 7..1 of byte 18 of a per-connection health entry, beside the role bit: v1 senders write 0; reserved zero bits under the general rule [decision]"
outcome = "a non-zero bit drops the section, counted as ReservedNonZero"

[[reserved]]
name = "regime_stamp_health_entry_bits_7_6_of_byte_64"
message = "regime stamp health entry (004-25)"
width = 2
value = 0
meaning = "bits 7..6 of byte 64 of a per-connection health entry, above the observed DSCP: v1 senders write 0; reserved zero bits under the general rule [decision]"
outcome = "a non-zero bit drops the section, counted as ReservedNonZero"

[[reserved]]
name = "regime_stamp_capability_ids_10_255"
message = "regime stamp capability entry (004-25)"
width = 8
value = "unused"
meaning = "capability ids 10 to 255 are unused in v1: v1 senders write the ids 1 to 9; an accept-any field, so that a later ticket adds a capability as a minor change [decision]"
outcome = "a v1 receiver checks the entry's state and order and otherwise ignores the entry; never a rejection"

[[reserved]]
name = "regime_stamp_alignment_entry_bits_7_1_of_byte_14"
message = "regime stamp alignment group entry (004-28)"
width = 7
value = 0
meaning = "bits 7..1 of byte 14 of an alignment group entry, beside the role bit: v1 senders write 0; reserved zero bits under the general rule [decision]"
outcome = "a non-zero bit drops the section, counted as ReservedNonZero"
# The protocol version fields (ticket 004-04): see the [versioning] schema
# documentation above. wire.md's "Versioning" section is the authority.

[versioning]
magic = 0x4d4e
magic_width = 2
version_width = 2
major = 1
minor = 0
version = 0x0100

# The media packet size budget (ticket 004-14): the machine-readable copy of
# the totals of wire.md's "Size budget" section, which is the authority and
# shows the arithmetic. Integers in bytes. The checker does not model this
# table; checks/004-14.sh requires every integer here to be a bound, a part
# size, a total or a spare of the wire.md tables, and recomputes each part
# from the [[message]] field tables below. Part sizes: packet header 16,
# slice header 22, announcement container 1 (count byte) to 49 (4 x 12 + 1),
# measurement extension 9, content-message header 3, checksum 4, audio
# 6 x 48 x 4 = 1152 (C-04). Totals include the audio; spares are the bound
# less the total. "fallback" is the C-06 path, 1252 bytes of UDP payload;
# the other cases are the 1472-byte path of C-100. The worst cases are the
# format's maximum (4 announcements); a v1 sender carries at most one
# announcement per packet, so its largest unshared packet is the fallback
# case with one announcement and the extension, 1219 bytes, on every path.
# The two shared_allowance keys are the bytes the 100-byte cap leaves for a
# single-stream source's controller messages (C-181): 100 - 63 - 4 = 33 for
# a stream that could carry the measurement extension, 100 - 54 - 4 = 42
# for one that could not.
[budget]
payload_bound = 1472
fallback_payload_bound = 1252
packet_header = 16
slice_header = 22
announcement_count = 1
announcement_container_max = 49
measurement_extension = 9
content_message_header = 3
checksum = 4
audio = 1152
mandatory_beside_audio = 46
maximum_beside_audio = 103
default_total = 1198
default_spare = 274
worst_total = 1255
worst_spare = 217
worst_no_extension_total = 1246
worst_no_extension_spare = 226
fallback_mandatory_total = 1198
fallback_mandatory_spare = 54
fallback_1_announcement_extension_total = 1219
fallback_1_announcement_extension_spare = 33
shared_allowance_could_carry_extension = 33
shared_allowance_could_not_carry_extension = 42

# The one example message (ticket 004-02 Work step 4): a placeholder with two
# fields, so the checker has something to verify. Later tickets (004-06 to
# 004-20) replace this placeholder with the real field tables, one [[message]]
# table per message, in both wire.md and this file.
[[message]]
name = "example"
layer = "control"
dscp = 40
max_size = 4
rejection_reasons = ["TooShort"]

[[message.field]]
name = "flags"
offset = 0
width = 8
type = "u8"
meaning = "example flags byte (placeholder; replaced by the real message tables)"
valid = "0 to 255"

[[message.field]]
name = "sequence"
offset = 8
width = 24
type = "uint"
meaning = "example 24-bit sequence number (placeholder; replaced by the real message tables)"
valid = "0 to 16777215"

# ---------------------------------------------------------------------------
# Media packet header (ticket 004-06) plus slice header (ticket 004-08) plus
# the announcement container (ticket 004-09): the machine-readable copies of
# wire.md's "Media packet header", "Slice header" and "Announcements" field
# tables, which are the human-readable authorities. Appended after the 004-02
# example message, kept separated for merge friendliness.
#
# The [[message]] below declares the packet HEADER, the SLICE HEADER and the
# ANNOUNCEMENT CONTAINER: the slice-header fields continue at bit 128 (byte
# 16) and add BadPacketIndex to this message's rejection reasons, and the
# announcement container continues at bit 304 (byte 38) as a count field plus
# a counted entry region — one 96-bit element per announcement, entries back
# to back, the per-announcement layout that makes an entry of an unknown type
# skippable by its length field (004-04). The element's own field table is
# the [[message]] "announcement" below, a section of this message. 004-10
# (measurement extension) extends this message further and grows its
# declared max_size; 004-13 (checksum) adds BadChecksum to its rejection
# reasons and declares the trailing checksum as a section message. The 9-byte
# measurement extension (ticket 004-10) follows the container; max_size is
# header + slice header + container + extension = 38 + 1 + 4 x 12 + 9 = 96
# bytes [decision]. The 4-byte slice checksum (ticket 004-13) trails the
# content and is declared as its own section message, "slice checksum",
# below; 96 + 4 = 100 bytes, the C-137 cap, before the audio message's
# 3-byte content-message header (004-11), which brings the format's maximum
# to 103 bytes; a v1 sender carries at most one announcement per packet, so
# it emits at most 67 (wire.md, Size budget) [decision].
# ---------------------------------------------------------------------------

[[message]]
name = "media packet"
layer = "media"
dscp = 46
max_size = 96
rejection_reasons = ["TooShort", "BadMagic", "VersionMismatch", "ForeignDomain", "UnconfiguredDomain", "UnknownStream", "UnadmittedSource", "WrongEpoch", "BadLength", "BadPacketIndex", "BadChecksum", "ReservedNonZero"]

[[message.field]]
name = "magic"
offset = 0
width = 16
type = "u16"
meaning = "magic 0x4d4e, the ASCII letters M and N, fixed by 004-04"
valid = "0x4d4e only"

[[message.field]]
name = "version"
offset = 16
width = 16
type = "u16"
meaning = "protocol version, major in bits 15..8, minor in bits 7..0; v1 packs 1.0 as 0x0100 (004-04)"
valid = "0x0100 in v1"

[[message.field]]
name = "domain"
offset = 32
width = 16
type = "u16"
meaning = "domain id (C-11); 0 is the unconfigured domain"
valid = "1 to 65535; 0 = unconfigured"

[[message.field]]
name = "stream_number"
offset = 48
width = 16
type = "u16"
meaning = "stream number at the source (C-10); the stream is identified by the source address pinned at admission plus this number, never by a destination (rule 7)"
valid = "0 to 255 (at most 256 streams per source, C-09)"

[[message.field]]
name = "session"
offset = 64
width = 32
type = "u32"
meaning = "session number (C-19): assigned by the source, one per stream, bumped on restart and on timeline-epoch change, and every consumer of a stream sees the same value — a stream property, not a per-receiver field"
valid = "any 32-bit value"

[[message.field]]
name = "timeline_epoch"
offset = 96
width = 16
type = "u16"
meaning = "timeline epoch: the epoch the packet's media-time positions are counted in (C-10)"
valid = "the consumer's current epoch"

[[message.field]]
name = "flags"
offset = 112
width = 8
type = "u8"
meaning = "flags: gap (bit 7), degraded (bit 6; C-122: the flag follows the content), announcement present (bit 5), measurement extension present (bit 4), bits 3..0 reserved"
valid = "bits 3..0 are zero; the other combinations are constrained by wire.md's validity rules"

[[message.field]]
name = "copy_index"
offset = 120
width = 2
type = "uint"
meaning = "copy index (C-07), bits 1..0 of byte 15: wire space for the deferred duplication feature (Reserved fields)"
valid = "0 to 3 in v1: senders emit 0, receivers accept all four values"

[[message.field]]
name = "flags_reserved"
offset = 122
width = 6
type = "uint"
meaning = "reserved, bits 7..2 of byte 15: senders write zero (004-05 general rule)"
valid = "0 only"
reserved = "0"

# Slice header (ticket 004-08): the fields continue the media packet at
# bit 128 (byte 16), offset for offset with wire.md's "Slice header" table,
# which is the human-readable authority.

[[message.field]]
name = "position"
offset = 128
width = 64
type = "u64"
meaning = "position: the content position of the slice's first frame on the domain line — samples at 96 000 Hz (C-01) counted from the domain epoch in the packet header's timeline epoch (C-10); the position half of the dedup key (rule 9)"
valid = "any 64-bit value"

[[message.field]]
name = "frames"
offset = 192
width = 16
type = "u16"
meaning = "frames: how many frames of media time the slice spans"
valid = "1 to 65 535; 48 in the default regime (C-02)"

[[message.field]]
name = "packet_index"
offset = 208
width = 16
type = "u16"
meaning = "packet index: this packet's index within its slice, 0-based"
valid = "0 to packet count − 1 (packet index < packet count)"

[[message.field]]
name = "packet_count"
offset = 224
width = 16
type = "u16"
meaning = "packet count: into how many packets the slice is split"
valid = "1 in the default regime (C-05); 2 to 65 535 in the stamped multi-packet regime"

[[message.field]]
name = "send_timestamp"
offset = 240
width = 64
type = "u64"
meaning = "send timestamp of this packet: 64 bits of nanoseconds of the sender's local monotonic clock (wire.md's Send timestamp)"
valid = "any 64-bit value"

# Announcement container (ticket 004-09): the fields continue the media
# packet at bit 304 (byte 38), offset for offset with wire.md's
# "Announcements" container table, which is the human-readable authority.
# The entry region is one counted field with a 96-bit element per
# announcement, so the entries stay back to back on the wire (an entry of an
# unknown type is skippable by its length field, 004-04); the element's field
# table is the [[message]] "announcement" below.

[[message.field]]
name = "announcement_count"
offset = 304
width = 8
type = "u8"
meaning = "announcement count: how many announcements follow the count field (004-09); the sender sets the flags byte's announcement bit (bit 5) exactly when this is at least 1"
valid = "0 to 4 [decision]"

[[message.field]]
name = "announcement_entry"
offset = 312
width = 96
type = "u128"
count = "announcement_count"
max_count = 4
meaning = "one announcement entry, 12 bytes, laid out as the [[message]] announcement below: type code 1 byte, length 1 byte, position 8 bytes, payload 2 bytes; entries are back to back with no separator, so a same-major receiver skips an entry whose type code it does not know by the entry's length field (004-04)"
valid = "0 to 4 entries (announcement_count), one per announcement kind; each entry as the announcement message lays it out"

# Measurement extension (ticket 004-10): the fields continue the media packet
# after the announcement container, offset for offset with wire.md's
# "Measurement extension" field table, which is the human-readable authority.
# On the wire the extension starts where the container ends, at byte
# 38 + 1 + 12 x count, and is present only when the flags byte's measurement
# bit (bit 4) is set; it is declared here at the container's maximum end,
# bit 696 (byte 87), the same maximum-occupancy model as the counted entry
# region, so the computed max_size covers it [decision].

[[message.field]]
name = "hop_count"
offset = 696
width = 8
type = "u8"
meaning = "hop count: how many processors have forwarded the content since its source, which emits 0; each processor adds 1 when it forwards; saturates at 64, never wraps (004-10)"
valid = "0 to 64 (C-34); 64 is the saturated value, read as 64 or more; above 64 is BadLength"

[[message.field]]
name = "residence_time"
offset = 704
width = 32
type = "u32"
meaning = "accumulated residence time: the sum over the forwarding processors of the time each held the content, in nanoseconds of each processor's local monotonic clock [decision]; saturates at 4 294 967 295, never wraps (004-10)"
valid = "any 32-bit value; 4 294 967 295 is the saturated value"

[[message.field]]
name = "declared_delay"
offset = 736
width = 32
type = "u32"
meaning = "accumulated declared delay: the sum of the forwarding processors' structural latency L, whole samples at the domain rate 96 000 Hz (C-01, C-105); saturates at 4 294 967 295, never wraps (004-10)"
valid = "any 32-bit value; 4 294 967 295 is the saturated value"

# The announcement entry (ticket 004-09): one entry of the media packet's
# announcement container, declared as a section of the media packet message;
# wire.md's per-type tables in the Announcements section are the
# human-readable authority.

[[message]]
name = "announcement"
layer = "media"
dscp = 46
max_size = 12
section_of = "media packet"
rejection_reasons = ["TooShort", "BadLength"]

[[message.field]]
name = "type"
offset = 0
width = 8
type = "u8"
meaning = "type code of the announcement: 0 end-of-stream, 1 re-alignment, 2 timeline epoch switch, 3 transport reference change (004-09)"
valid = "0 to 3 in v1; a same-major receiver skips a value it does not know by length (004-04)"

[[message.field]]
name = "length"
offset = 8
width = 8
type = "u8"
meaning = "length: the announcement's body length in bytes after this field — the length prefix that makes an entry of an unknown type skippable (004-04)"
valid = "10 in v1: the 8-byte position plus the 2-byte payload"

[[message.field]]
name = "position"
offset = 16
width = 64
type = "u64"
meaning = "position: the announcement's named future position — samples at 96 000 Hz (C-01) counted from the domain epoch in the packet header's timeline epoch (C-10), the slice header's position form"
valid = "any 64-bit value; a position at or before the packet's slice position is dropped under BadLength (wire.md, Announcements, Validity rules); the C-43 lead binds only the sender's first issue, so a C-44 re-issue inside it is valid [decision]"

[[message.field]]
name = "payload"
offset = 80
width = 16
type = "u16"
meaning = "payload: the announcement's type-specific payload; in v1 only the epoch switch fills it — the new 16-bit timeline epoch (C-10)"
valid = "the new timeline epoch for type code 2; 0 for type codes 0, 1 and 3 [decision]"

# Slice checksum (ticket 004-13): wire.md's "Checksum" field table is the
# human-readable authority. The checksum trails the content: it is the last
# 4 bytes of the UDP payload of the slice's last packet (packet index =
# packet count - 1), at offset payload length - 4, so it has no fixed offset
# from the packet's start and is declared as a section of the media packet,
# the precedent of the announcement entry; its offset 0 is the checksum's
# own first byte [decision]. Algorithm CRC-32C: width 32, poly 0x1EDC6F41,
# init 0xFFFFFFFF, refin and refout true, xorout 0xFFFFFFFF, check
# 0xE3069283.

[[message]]
name = "slice checksum"
layer = "media"
dscp = 46
max_size = 4
section_of = "media packet"
rejection_reasons = ["BadLength", "BadChecksum"]

[[message.field]]
name = "checksum"
offset = 0
width = 32
type = "u32"
meaning = "slice checksum: CRC-32C of the slice's covered bytes — for each packet in packet-index order, packet header bytes 0 to 13, the flags byte AND 0xC0, slice header bytes 16 to 25, the announcement container and the content region — stored little-endian; the last 4 bytes of the last packet's UDP payload (004-13)"
valid = "any 32-bit value; a value that differs from the recomputed CRC is BadChecksum"

# ---------------------------------------------------------------------------
# Content messages (ticket 004-11): wire.md's "Content messages" field tables
# are the human-readable authority. Every content message starts with the
# 3-byte common header (kind u8, length u16); offsets below are relative to
# the message's own first byte, as for the announcement entry.
#
# None of the three carries section_of. On wire grounds a content message
# belongs to the slice's content, laid over the concatenated content regions
# of its packets, and may continue from one packet into the next, so it is
# not a part of one packet [decision]. The choice is also forced for the
# audio and dense messages: the checker applies the 1 252-byte bound of C-17
# to every message with section_of, and their maximums exceed it. The
# relation is provisional pending a tooling item on that checker rule
# (004-02) [decision].
#
# The sample and value runs are one 4-byte element counted by the length, so
# max_size is the true maximum a parser sizes for: 16 383 elements (65 532
# bytes) under the u16 length; 3 + 65 532 = 65 535 bytes for audio and
# 6 + 65 532 = 65 538 for dense (at the default 48 frames: 65 475 and
# 48 966). The schema has no union type: type = "f32" stands for either
# sample format, f32 or Q1.31, as the stream's manifest declares (004-26).
# ---------------------------------------------------------------------------

[[message]]
name = "content-message header"
layer = "media"
dscp = 46
max_size = 3
rejection_reasons = ["BadLength"]

[[message.field]]
name = "kind"
offset = 0
width = 8
type = "u8"
meaning = "kind: which content message follows; 0 audio, 1 dense controllers, 2 sparse keyed controllers and 3 transport state (laid out by 004-12)"
valid = "0 to 3 in v1; a same-major receiver skips any other value by the length (004-04)"

[[message.field]]
name = "length"
offset = 8
width = 16
type = "u16"
meaning = "length: how many body bytes follow the length field, the common header not included; the prefix that makes a message of an unknown kind skippable"
valid = "0 to 65 535; the body must end inside the content region, else BadLength"

[[message]]
name = "audio message"
layer = "media"
dscp = 46
max_size = 65535
rejection_reasons = ["BadLength"]

[[message.field]]
name = "kind"
offset = 0
width = 8
type = "u8"
meaning = "kind: 0, audio"
valid = "0"

[[message.field]]
name = "length"
offset = 8
width = 16
type = "u16"
meaning = "length: frames x channels x 4, the samples that follow; the channel count is length / (frames x 4) and must equal the manifest's channel map"
valid = "1 152 in a default slice (48 frames x 6 channels x 4); at most 65 535"

[[message.field]]
name = "sample"
offset = 24
width = 32
type = "f32"
count = "length"
max_count = 16383
meaning = "one 4-byte sample, f32 or Q1.31 as the stream's manifest declares (004-26, C-03); the samples run channel by channel, frames x 4 bytes per channel (192 per channel per default slice, C-04), channels in the manifest's channel-map order with no per-channel id byte; the count is length / 4"
valid = "at most 16 383 samples (65 532 bytes); 1 to 341 channels at the default 48 frames"

[[message]]
name = "dense controller message"
layer = "media"
dscp = 46
max_size = 65538
rejection_reasons = ["BadLength"]

[[message.field]]
name = "kind"
offset = 0
width = 8
type = "u8"
meaning = "kind: 1, dense controllers"
valid = "1"

[[message.field]]
name = "length"
offset = 8
width = 16
type = "u16"
meaning = "length: 3 + count x (frames / stride) x 4, the body that follows"
valid = "195 for one controller at one value per frame in a default slice; at most 65 535"

[[message.field]]
name = "count"
offset = 24
width = 8
type = "u8"
meaning = "count: how many dense controllers this message carries, continuing the manifest's controller map from the previous dense message of the slice"
valid = "1 to 255"

[[message.field]]
name = "stride"
offset = 32
width = 16
type = "u16"
meaning = "stride: frames per value; 1 is one value per frame, a larger stride is the stated sub-rate (96 000 / stride values per second)"
valid = "1 to frames, dividing frames"

[[message.field]]
name = "value"
offset = 48
width = 32
type = "f32"
count = "length"
max_count = 16383
meaning = "one 4-byte value in the stream's sample format, f32 or Q1.31 (004-26); the values run controller by controller, (frames / stride) x 4 bytes per controller (192 at one value per frame in a default slice), in controller-map order with no id; no initial-value field (C-158); the count is (length - 3) / 4"
valid = "count x (frames / stride) values, at most 16 383 (65 532 bytes); count at most 255"

# Sparse keyed controllers and transport state (ticket 004-12): wire.md's
# "Sparse keyed controllers and transport state" field tables are the
# human-readable authority. Both messages start with the 3-byte common
# header and carry no section_of, for the reason the content-message
# comment above gives. The sparse entries are one 8-byte element counted by
# the count field, max_count = 128, so max_size = 3 + 1 + 128 x 8 = 1 028
# bytes; the entry's own layout is the "sparse keyed entry" message below
# (the announcement entry's precedent). The schema has no blob type, so the
# counted entry is declared u64 and the target value f32, which stands for
# either sample format, f32 or Q1.31, as the stream's manifest declares
# (004-26). The transport state message is 30 bytes, fixed.

[[message]]
name = "sparse keyed controller message"
layer = "media"
dscp = 46
max_size = 1028
rejection_reasons = ["BadLength"]

[[message.field]]
name = "kind"
offset = 0
width = 8
type = "u8"
meaning = "kind: 2, sparse keyed controllers"
valid = "2"

[[message.field]]
name = "length"
offset = 8
width = 16
type = "u16"
meaning = "length: 1 + count x 8, the body that follows"
valid = "9 to 1 025; any other value, or one that disagrees with the count, is BadLength"

[[message.field]]
name = "count"
offset = 24
width = 8
type = "u8"
meaning = "count: how many entries follow the count field"
valid = "1 to 128; 0 or above 128 is BadLength"

[[message.field]]
name = "entry"
offset = 32
width = 64
type = "u64"
meaning = "one 8-byte sparse keyed entry, laid out as the [[message]] sparse keyed entry below: voice key 1 byte, field id 1 byte, start offset 2 bytes, target value 4 bytes; entries are back to back with no separator"
valid = "count entries, at most 128 (1 024 bytes); no (voice, field) twice in one slice"
count = "count"
max_count = 128

[[message]]
name = "sparse keyed entry"
layer = "media"
dscp = 46
max_size = 8
rejection_reasons = ["BadLength"]

[[message.field]]
name = "voice_key"
offset = 0
width = 8
type = "u8"
meaning = "voice key: which voice of the stream the entry moves, a key the producer allocates"
valid = "0 to 255; every value is a valid key"

[[message.field]]
name = "field_id"
offset = 8
width = 8
type = "u8"
meaning = "field id: which field of the voice the entry moves, an index into the stream's sparse field map in the manifest (004-26)"
valid = "a field id the stream's sparse field map declares; any other is BadLength"

[[message.field]]
name = "start_offset"
offset = 16
width = 16
type = "u16"
meaning = "start offset: the frame of the slice at which the linear ramp starts, counted from the slice's first frame; the ramp reaches the target at the slice's last frame"
valid = "0 to frames - 1 (0 to 47 in a default slice, C-02); frames or above is BadLength"

[[message.field]]
name = "target_value"
offset = 32
width = 32
type = "f32"
meaning = "target value in the stream's sample format, f32 or Q1.31 as its manifest declares (004-26, C-03): the value the field reaches at the slice's last frame"
valid = "any 32-bit pattern"

[[message]]
name = "transport state message"
layer = "media"
dscp = 46
max_size = 30
rejection_reasons = ["BadLength"]

[[message.field]]
name = "kind"
offset = 0
width = 8
type = "u8"
meaning = "kind: 3, transport state, read-only"
valid = "3"

[[message.field]]
name = "length"
offset = 8
width = 16
type = "u16"
meaning = "length: 27, the body that follows"
valid = "27; any other value is BadLength"

[[message.field]]
name = "state"
offset = 24
width = 8
type = "u8"
meaning = "state: 0 stopped, 1 playing"
valid = "0 or 1; any other value is BadLength"

[[message.field]]
name = "meter_numerator"
offset = 32
width = 8
type = "u8"
meaning = "meter numerator: beats per bar"
valid = "1 to 255; 0 is BadLength"

[[message.field]]
name = "meter_denominator"
offset = 40
width = 8
type = "u8"
meaning = "meter denominator: the note value of one beat, 4 for a quarter note"
valid = "1, 2, 4, 8, 16, 32, 64 or 128; any other value is BadLength"

[[message.field]]
name = "tempo"
offset = 48
width = 32
type = "u32"
meaning = "tempo in beats per minute, unsigned Q16.16: 65 536 units per bpm, so 7 864 320 = 120 beats per minute (C-199)"
valid = "1 to 4 294 967 295; 0 is BadLength"

[[message.field]]
name = "beat_playhead"
offset = 80
width = 64
type = "i64"
meaning = "beat playhead: the transport's position in beats at the slice's first frame, signed Q32.32; while playing it advances by floor(n x tempo x 65 536 / 5 760 000) over n frames"
valid = "any 64-bit value"

[[message.field]]
name = "time_code_position"
offset = 144
width = 64
type = "i64"
meaning = "time code position: the transport's timeline position at the slice's first frame, in samples at 96 000 Hz (C-01), advancing one per frame while playing"
valid = "any 64-bit value"

[[message.field]]
name = "bar_origin"
offset = 208
width = 32
type = "i32"
meaning = "bar origin: the beat at which bar 0 starts under the current meter, in whole beats, scaled by 2^32 when compared with the Q32.32 beat playhead: bar = floor((beat playhead - origin x 2^32) / (numerator x 2^32)), in 128-bit signed arithmetic"
valid = "any 32-bit value"

# Sync request and reply (ticket 004-19): the machine-readable copy of
# wire.md's "Sync request and reply" section, which is the authority. Both
# messages are 74 bytes; the request reaches the reply's size by explicit
# padding. Neither carries a DSCP or a request-rate field (C-152, C-204).

[[message]]
name = "sync request"
layer = "sync"
dscp = 48
max_size = 74
rejection_reasons = ["TooShort", "BadMagic", "VersionMismatch", "BadLength", "UnconfiguredDomain", "ForeignDomain", "ReservedNonZero"]

[[message.field]]
name = "magic"
offset = 0
width = 16
type = "u16"
meaning = "magic 0x4d4e, the ASCII letters M and N, fixed by 004-04"
valid = "0x4d4e only"

[[message.field]]
name = "version"
offset = 16
width = 16
type = "u16"
meaning = "protocol version, major in bits 15..8, minor in bits 7..0; v1 packs 1.0 as 0x0100 (004-04)"
valid = "major 1, any minor; senders write 0x0100"

[[message.field]]
name = "domain"
offset = 32
width = 16
type = "u16"
meaning = "domain id (C-11); 0 is the unconfigured domain"
valid = "1 to 65535; 0 = unconfigured"

[[message.field]]
name = "message_type"
offset = 48
width = 8
type = "u8"
meaning = "message type, scoped to the sync layer: 1 = sync request"
valid = "1 only"

[[message.field]]
name = "authentication_scheme"
offset = 56
width = 8
type = "u8"
meaning = "authentication scheme (C-12); 0 = none in v1 (C-115)"
valid = "0 only"

[[message.field]]
name = "message_counter"
offset = 64
width = 64
type = "u64"
meaning = "message counter (C-12): live (C-115), incremented by one for every sync message the follower sends"
valid = "any 64-bit value"

[[message.field]]
name = "authentication_tag"
offset = 128
width = 128
type = "u128"
meaning = "authentication tag (C-12): 128 zero bits in v1 (C-115)"
valid = "0 only"

[[message.field]]
name = "send_timestamp"
offset = 256
width = 64
type = "u64"
meaning = "send timestamp: the follower's local monotonic clock in nanoseconds when it sends the request; opaque to the holder, which echoes it verbatim"
valid = "any 64-bit value"

[[message.field]]
name = "padding"
offset = 320
width = 272
type = "pad"
meaning = "padding to the reply's size: the room the reply's receive and send timestamps, holder module id, epoch origin and timeline epoch take; senders write zero (004-05 general rule)"
valid = "0 only"

[[message]]
name = "sync reply"
layer = "sync"
dscp = 48
max_size = 74
rejection_reasons = ["TooShort", "BadMagic", "VersionMismatch", "BadLength", "UnconfiguredDomain", "ForeignDomain", "ReservedNonZero", "UnadmittedSource", "WrongEpoch"]

[[message.field]]
name = "magic"
offset = 0
width = 16
type = "u16"
meaning = "magic 0x4d4e, the ASCII letters M and N, fixed by 004-04"
valid = "0x4d4e only"

[[message.field]]
name = "version"
offset = 16
width = 16
type = "u16"
meaning = "protocol version, major in bits 15..8, minor in bits 7..0; v1 packs 1.0 as 0x0100 (004-04)"
valid = "major 1, any minor; senders write 0x0100"

[[message.field]]
name = "domain"
offset = 32
width = 16
type = "u16"
meaning = "domain id (C-11); 0 is the unconfigured domain"
valid = "1 to 65535; 0 = unconfigured"

[[message.field]]
name = "message_type"
offset = 48
width = 8
type = "u8"
meaning = "message type, scoped to the sync layer: 2 = sync reply"
valid = "2 only"

[[message.field]]
name = "authentication_scheme"
offset = 56
width = 8
type = "u8"
meaning = "authentication scheme (C-12); 0 = none in v1 (C-115)"
valid = "0 only"

[[message.field]]
name = "message_counter"
offset = 64
width = 64
type = "u64"
meaning = "message counter (C-12): live (C-115), incremented by one for every sync message the holder sends"
valid = "any 64-bit value"

[[message.field]]
name = "authentication_tag"
offset = 128
width = 128
type = "u128"
meaning = "authentication tag (C-12): 128 zero bits in v1 (C-115)"
valid = "0 only"

[[message.field]]
name = "echoed_send_timestamp"
offset = 256
width = 64
type = "u64"
meaning = "echoed send timestamp: the request's send timestamp, echoed verbatim; the follower's clock, never the holder's"
valid = "any 64-bit value"

[[message.field]]
name = "receive_timestamp"
offset = 320
width = 64
type = "u64"
meaning = "receive timestamp: the holder's monotonic clock in nanoseconds when the request was received"
valid = "any 64-bit value"

[[message.field]]
name = "send_timestamp"
offset = 384
width = 64
type = "u64"
meaning = "send timestamp: the holder's monotonic clock in nanoseconds when the reply is sent"
valid = "any 64-bit value"

[[message.field]]
name = "holder_module_id"
offset = 448
width = 64
type = "u64"
meaning = "holder module id (C-11): the module id of the holder that answers"
valid = "any 64-bit value; a follower accepts only the holder it follows"

[[message.field]]
name = "epoch_origin"
offset = 512
width = 64
type = "i64"
meaning = "epoch origin: origin_ns of the current timeline epoch's line, nanoseconds of network time on the holder's scale (timeline.md)"
valid = "any 64-bit value"

[[message.field]]
name = "timeline_epoch"
offset = 576
width = 16
type = "u16"
meaning = "timeline epoch (C-10): the holder's current timeline epoch"
valid = "any 16-bit value; acceptance at a follower per wire.md, Sync request and reply"

# Receiver report and one-way probe (ticket 004-20): the machine-readable
# copy of wire.md's "Receiver report" and "One-way probe" sections, which
# are the authority. Neither message carries the C-12 authentication
# reservation (wire.md, Receiver report, Authentication reservation). The
# report is a 38-byte fixed part followed by one 37-byte member row per
# admitted member, counted by member_count with max_count = 32 (C-08), so
# max_size = 38 + 32 x 37 = 1 222 bytes, inside the 1 252-byte bound wire.md
# adopts for the measurement layer. The schema has no struct or blob type,
# so the counted 296-bit member row is declared "uint", the schema's one
# type without a fixed width; the row's own layout is the [[message]]
# "receiver report member" below (the sparse keyed entry's precedent).
# The probe request and reply are both 48 bytes; the request reaches the
# reply's size by explicit padding, and the reply's byte 7 carries the
# responder's clock state.

[[message]]
name = "receiver report"
layer = "measurement"
dscp = 40
max_size = 1222
rejection_reasons = ["TooShort", "BadMagic", "VersionMismatch", "BadLength", "UnconfiguredDomain", "ForeignDomain", "ReservedNonZero", "UnadmittedSource", "UnknownStream"]

[[message.field]]
name = "magic"
offset = 0
width = 16
type = "u16"
meaning = "magic 0x4d4e, the ASCII letters M and N, fixed by 004-04"
valid = "0x4d4e only"

[[message.field]]
name = "version"
offset = 16
width = 16
type = "u16"
meaning = "protocol version, major in bits 15..8, minor in bits 7..0; v1 packs 1.0 as 0x0100 (004-04)"
valid = "major 1, any minor; senders write 0x0100"

[[message.field]]
name = "domain"
offset = 32
width = 16
type = "u16"
meaning = "domain id (C-11); 0 is the unconfigured domain"
valid = "1 to 65535; 0 = unconfigured"

[[message.field]]
name = "message_type"
offset = 48
width = 8
type = "u8"
meaning = "message type, scoped to the measurement layer: 1 = receiver report"
valid = "1 only"

[[message.field]]
name = "member_count"
offset = 56
width = 8
type = "u8"
meaning = "member count: how many member rows follow the fixed part, one per bundle member admitted to this consumer (C-08)"
valid = "1 to 32"

[[message.field]]
name = "bundle_identity"
offset = 64
width = 64
type = "u64"
meaning = "bundle identity: the module id (C-11) of the bundle's source; with the rows' stream numbers it names exactly one bundle"
valid = "any 64-bit value; a producer accepts only its own module id"

[[message.field]]
name = "reporter_identity"
offset = 128
width = 64
type = "u64"
meaning = "reporter identity: the module id (C-11) of the consumer that sends the report"
valid = "any 64-bit value; a producer keys the connection by this identity with the bundle the first row's stream number names, and accepts only a module admitted for that bundle"

[[message.field]]
name = "report_number"
offset = 192
width = 16
type = "u16"
meaning = "report number: 0 for the connection's first report after admission, then incremented by one per report; wraps modulo 2^16; compared in serial order over half the range"
valid = "any 16-bit value"

[[message.field]]
name = "socket_drop"
offset = 208
width = 32
type = "u32"
meaning = "socket drop: datagrams the kernel dropped at the consumer's receiving socket of this bundle for lack of buffer room; cumulative, wraps modulo 2^32"
valid = "any 32-bit value"

[[message.field]]
name = "interface_drop"
offset = 240
width = 32
type = "u32"
meaning = "interface drop: packets the consumer's receiving interface dropped, the low 32 bits of the interface's own drop count; cumulative, wraps modulo 2^32"
valid = "any 32-bit value"

[[message.field]]
name = "current_a"
offset = 272
width = 32
type = "u32"
meaning = "current A: the consumer's current A (C-198), its own or the one it inherited (C-142), in nanoseconds; 0 = no A known to the reporter"
valid = "0 to 4 294 967 295 ns: every value is valid; 0 = no A known"

[[message.field]]
name = "member"
offset = 304
width = 296
type = "uint"
meaning = "one 37-byte member row, laid out as the [[message]] receiver report member below: stream number, the eleven C-159 counters (six of 32 bits, five of 16 bits), the observed bit, one padding bit and the observed DSCP; rows back to back in the order of the consumer's admission"
valid = "member_count rows, at most 32 (1 184 bytes)"
count = "member_count"
max_count = 32

[[message]]
name = "receiver report member"
layer = "measurement"
dscp = 40
max_size = 37
rejection_reasons = ["UnknownStream", "ReservedNonZero"]

[[message.field]]
name = "stream_number"
offset = 0
width = 16
type = "u16"
meaning = "stream number (C-10) at the bundle's source of the member this row reports on"
valid = "0 to 255 (C-09); the member admitted to this consumer at this row; any other is UnknownStream"

[[message.field]]
name = "received"
offset = 16
width = 32
type = "u32"
meaning = "received: slices of this member accepted with content, neither late, missing nor a marked gap; cumulative, wraps modulo 2^32"
valid = "any 32-bit value"

[[message.field]]
name = "late"
offset = 48
width = 32
type = "u32"
meaning = "late: slices counted missing at their deadline that arrived later within the ring span and were reclassified late (C-108); cumulative, wraps modulo 2^32"
valid = "any 32-bit value"

[[message.field]]
name = "missing"
offset = 80
width = 32
type = "u32"
meaning = "missing: slices absent at their deadline and not reclassified late since; decreases by one on every reclassification (C-108); cumulative, wraps modulo 2^32"
valid = "any 32-bit value"

[[message.field]]
name = "marked_gap"
offset = 112
width = 16
type = "u16"
meaning = "marked gap: positions the producer marked with a gap slice (rule 10), in slices; cumulative, wraps modulo 2^16"
valid = "any 16-bit value"

[[message.field]]
name = "other_epoch"
offset = 128
width = 32
type = "u32"
meaning = "other-epoch: packets on another timeline epoch, never a miss (C-135, C-102); cumulative, wraps modulo 2^32"
valid = "any 32-bit value"

[[message.field]]
name = "too_early"
offset = 160
width = 32
type = "u32"
meaning = "too-early: packets that arrived too early for the consumer to place their slice and were discarded (epic 009 classifies); cumulative, wraps modulo 2^32"
valid = "any 32-bit value"

[[message.field]]
name = "duplicates"
offset = 192
width = 32
type = "u32"
meaning = "duplicates: packets discarded as duplicates by stream, position and packet index (rule 9); cumulative, wraps modulo 2^32"
valid = "any 32-bit value"

[[message.field]]
name = "incomplete_reassemblies"
offset = 224
width = 16
type = "u16"
meaning = "incomplete reassemblies: multi-packet slices not complete at their reassembly deadline (C-15, C-110), in slices; cumulative, wraps modulo 2^16"
valid = "any 16-bit value"

[[message.field]]
name = "demoted_rounds"
offset = 240
width = 16
type = "u16"
meaning = "demoted rounds: rounds, one per slice period, in which this member was Demoted and treated as gapped (C-109); cumulative, wraps modulo 2^16"
valid = "any 16-bit value"

[[message.field]]
name = "interrupted_events"
offset = 256
width = 16
type = "u16"
meaning = "interrupted events: entries of this member into Interrupted (C-38, C-102); cumulative, wraps modulo 2^16"
valid = "any 16-bit value"

[[message.field]]
name = "dead"
offset = 272
width = 16
type = "u16"
meaning = "dead: entries of this member into Dead (C-39, C-111); cumulative, wraps modulo 2^16"
valid = "any 16-bit value"

[[message.field]]
name = "observed"
offset = 288
width = 1
type = "uint"
meaning = "observed, bit 0 of byte 36: 1 = the observed DSCP holds a value read from a received packet of this member, 0 = none read yet or the consumer cannot read it"
valid = "0 or 1"

[[message.field]]
name = "padding"
offset = 289
width = 1
type = "pad"
meaning = "padding, bit 1 of byte 36: senders write zero (004-05 general rule)"
valid = "0 only"
reserved = "0"

[[message.field]]
name = "observed_dscp"
offset = 290
width = 6
type = "uint"
meaning = "observed DSCP, bits 7..2 of byte 36: the DSCP of the IPv4 header of the last packet of this member the consumer received (C-13)"
valid = "0 to 63; 0 when observed is 0"

[[message]]
name = "one-way probe request"
layer = "measurement"
dscp = 46
max_size = 48
rejection_reasons = ["TooShort", "BadMagic", "VersionMismatch", "BadLength", "UnconfiguredDomain", "ForeignDomain", "ReservedNonZero", "UnadmittedSource"]

