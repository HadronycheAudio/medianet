# Machine-readable wire tables — schema revision 1 (ticket 004-02).
#
# This file is the machine-readable form of the field tables in
# `doc/design/spec/wire.md` (C-130). Task 007 (conformance) generates its test
# vectors from it; tasks 009 to 014 implement the layouts it describes. The
# checker `hadronyche-tools::wire_tables::check_file` (C-133) verifies it in
# CI, unprivileged: parse, round-trip, field coverage, declared versus
# computed maximum size, the 1 252-byte control bound (C-17, C-116), and —
# from ticket 004-03 — that every `rejection_reasons` entry is a member of
# the closed `Reject` enumeration declared below. From ticket 004-05 the
# `[[reserved]]` entries below carry the reserved fields' required v1
# values, which the checker parses and round-trips.
#
# # Schema, revision 1
#
# Top level (the four unit keys are required, exactly these units; the
# optional `reject` array of tables, from ticket 004-03, is the fifth
# top-level key, and the optional `reserved` array of tables, from ticket
# 004-05, is the sixth):
#
#   schema       = 1        integer schema revision; this file is revision 1.
#   offset_unit  = "bits"   every field `offset` is a bit position counted
#                           from bit 0 of the message start.
#   width_unit   = "bits"   every field `width` is a bit count. For a counted
#                           field (see `count`) the width is the width of ONE
#                           element; the field occupies width * max_count bits.
#   size_unit    = "bytes"  every `max_size` is a byte count.
#
# Per rejection reason, one `[[reject]]` table (ticket 004-03), in value
# order; together the entries are the closed `Reject` enumeration of
# wire.md's "Rejection reasons" section:
#
#   name    = "..."   the variant name, unique, non-empty, CamelCase as in
#                     wire.md.
#   value   = N        the variant's u8 value, unique, 0..=255. The values are
#                     stable across minor versions; the enumeration is closed
#                     within a major version, with values 13..=255 reserved
#                     for a future major version [decision].
#   meaning = "..."   the one-line meaning, as in wire.md.
#
# The array is optional (the 004-02 fixtures predate it); the canonical file
# declares it. When present it must declare exactly the closed set pinned by
# the checker, name-for-name and value-for-value — the enumeration is
# closed, so a file cannot redefine it — and every entry of a message's
# `rejection_reasons` must name a member.
#
# Per reserved field, one `[[reserved]]` table (ticket 004-05), in wire.md's
# "Reserved fields" order; together the entries are that section, which is
# the human-readable authority the file must agree with:
#
#   name    = "..."   unique, non-empty field name, as in wire.md.
#   message = "..."   where the field lives (message and the ticket that
#                     places it).
#   width   = N       bit count.
#   value   = ...     the required v1 value: an integer (e.g. 0) or free
#                     text ("zero", "live").
#   live    = true     optional, only for a live field (C-115): the field is
#                     live in v1, not a reserved zero field, so it carries
#                     any value and never produces ReservedNonZero. A live
#                     field cannot also be fixed at 0.
#   meaning = "..."   the required v1 value, as in wire.md.
#   outcome = "..."   the receiver outcome on a non-conforming value.
#
# The array is optional; the canonical file declares it. The general rule of
# wire.md's section is stated here once for the file too: senders zero every
# padding and reserved bit a later ticket adds, and receivers drop and count
# a non-zero value as ReservedNonZero.
#
# The protocol version fields (ticket 004-04), one `[versioning]` table: the
# machine-readable copy of wire.md's "Versioning" section, which states the
# rules; the two must agree value for value. The checker does not model this
# table (versioning rules are wire.md's to state; the fields belong to the
# per-message tables that 004-06 onward add), but the conformance task 007
# generates from it:
#
#   magic         = 0x4d4e  the 2-byte magic of every message, at offset 0;
#                           distinct in both bytes from the retired POC's
#                           0x4844 [decision].
#   magic_width   = 2       the magic's width in bytes.
#   version_width = 2       the version field's width in bytes, at offset 2.
#   major         = 1       v1's major: the high byte of the version u16
#                           (bits 15..8) [decision].
#   minor         = 0       v1's minor: the low byte of the version u16
#                           (bits 7..0) [decision].
#   version       = 0x0100  v1's packed value, major << 8 | minor.

# Per message, one `[[message]]` table; `name` is unique and non-empty:
#
#   name         = "..."    unique, non-empty message name.
#   layer        = "..."    one of "control", "sync", "media", "measurement".
#   dscp         = N        the DiffServ codepoint, an integer 0..=63.
#   max_size     = N        the declared maximum size in bytes. Every message
#                           has a fixed maximum, because a `no_std` core crate
#                           parses it without allocation and in bounded time
#                           [decision].
#                           (The deprecated spelling `maximum_size` is still
#                           accepted by the parser, but the canonical writer
#                           emits `max_size`, so a file using the deprecated
#                           spelling fails the round-trip check; use
#                           `max_size`.)
#   section_of   = "..."    optional: this message is a section of the named
#                           parent message (the regime stamp is split into
#                           sections that each fit the control bound, C-18).
#   exempt_from_control_bound = "C-116"
#                           optional: the only exemption from the 1 252-byte
#                           control bound, for the path-MTU probe pair, which
#                           is sent at the intended media packet size (C-116).
#                           Any other value is a parse error.
#   rejection_reasons = ["...", ...]
#                           the rejection reasons this message can produce, in
#                           table order. From ticket 004-03 each entry must be
#                           a member of the closed `Reject` enumeration (the
#                           `[[reject]]` tables above); the checker rejects a
#                           file whose message names a non-member.
#
# Per field, one `[[message.field]]` table inside its message; `name` is
# unique within the message, and the fields must cover the message from bit 0
# with no overlap and no undeclared gap (a `type = "pad"` field declares
# padding):
#
#   name     = "..."        unique, non-empty field name.
#   offset   = N            bit position from the message start (bits).
#   width    = N            bit count (bits); the field occupies
#                           [offset, offset + width), or
#                           [offset, offset + width * max_count) when `count`
#                           is present.
#   type     = "..."        one of:
#                             "uint"   sub-byte unsigned integer (e.g. the
#                                      2-bit copy index, C-07);
#                             "u8" "u16" "u32" "u64" "u128"
#                                      fixed-width unsigned integers
#                                      (C-10, C-11, C-12);
#                             "i8" "i16" "i32" "i64" "i128"
#                                      fixed-width signed integers;
#                             "f32"    one 4-byte sample (C-03);
#                             "q1.31"  Q1.31 fixed-point sample;
#                             "pad"    declared padding (zero bits on the
#                                      wire); a pad field is what makes an
#                                      otherwise undeclared gap legal.
#   meaning  = "..."        what the field carries.
#   valid    = "..."        the valid range, free text (e.g. "0 to 255").
#   reserved = "..."        optional: the reserved value, when one exists
#                           (rules for reserved fields are ticket 004-05).
#   count    = "..."        optional: the name of the field that counts this
#                           list; `width` is then per element.
#   max_count = N           required with `count`: the list's fixed maximum
#                           (e.g. at most 32 bundle members, C-08; at most 64
#                           peers, C-34). This is how the maximum message size
#                           is computed from the file alone: the declared
#                           `max_size` must equal the size computed from the
#                           fields and maximum counts, which is why counted
#                           lists are encoded as a count field plus a maximum
#                           count and never as an unbounded list.
#
# The checker runs the rules in this order: parse (from ticket 004-03 this
# includes rejecting any `rejection_reasons` entry that is not a member of
# the `[[reject]]` enumeration; from ticket 004-05 it also parses the
# `[[reserved]]` entries); round-trip (re-serialise, re-parse, compare
# models, reserved entries included); field coverage (overlap, then gap);
# declared versus computed maximum size; and the 1 252-byte control bound
# for control messages and regime stamp sections, with the C-116 exemption.

schema = 1
offset_unit = "bits"
width_unit = "bits"
size_unit = "bytes"

# The closed `Reject` enumeration (ticket 004-03): the machine-readable copy
# of wire.md's "Rejection reasons" section, which is the human-readable
# authority; the two must agree name-for-name and value-for-value. The
# enumeration is closed within a major version, and values 13..=255 are
# reserved for a future major version and stay unused [decision].

[[reject]]
name = "TooShort"
value = 0
meaning = "fewer bytes than the message's fixed minimum: dropped before any field is read"

[[reject]]
name = "BadMagic"
value = 1
meaning = "the leading bytes are not the magic of any message of this major version; the magic is fixed by 004-04"

[[reject]]
name = "VersionMismatch"
value = 2
meaning = "the version field is not the version of this major version: counted like every rejection and also raises a named event (never a silent drop); the version travels in the hello, so the mismatch is found before a connection exists"

[[reject]]
name = "ForeignDomain"
value = 3
meaning = "the domain id is a non-zero domain other than this module's (C-11): dropped and counted"

[[reject]]
name = "UnconfiguredDomain"
value = 4
meaning = "the domain id is 0, the unconfigured domain (C-11): the packet is ignored and counted, not refused, and is never a ForeignDomain (C-173)"

[[reject]]
name = "UnknownStream"
value = 5
meaning = "the stream number names no stream this consumer admits"

[[reject]]
name = "UnadmittedSource"
value = 6
meaning = "the source's module id has no admitted connection at this consumer"

[[reject]]
name = "BadLength"
value = 7
meaning = "a declared length or count disagrees with the message's own size rules: a count above its fixed maximum, or a body that does not fill the fixed size"

[[reject]]
name = "BadChecksum"
value = 8
meaning = "the checksum does not match the recomputed value; the checksum arrives with 004-13"

[[reject]]
name = "BadPacketIndex"
value = 9
meaning = "the packet index lies outside the packet count its slice declares"

[[reject]]
name = "WrongEpoch"
value = 10
meaning = "the timeline epoch is not the consumer's current epoch (C-10): counted under this reason — the per-connection other-epoch counter (C-135, C-159) — and never a miss (C-102)"

[[reject]]
name = "OversizeControl"
value = 11
meaning = "a control message exceeds the 1 252-byte UDP-payload bound (C-17)"

[[reject]]
name = "ReservedNonZero"
value = 12
meaning = "a field this specification fixes at zero carries a non-zero value; the fields and their required zeros are fixed by 004-05"

# Reserved values (ticket 004-05): the machine-readable copy of wire.md's
# "Reserved fields" section, which is the human-readable authority; the two
# must agree. One [[reserved]] entry per reserved field, in wire.md order.

[[reserved]]
name = "copy_index"
message = "media packet header (C-07, placed by 004-06)"
width = 2
value = 0
meaning = "wire space kept for the deferred duplication feature: v1 senders emit 0 only, and v1 receivers accept all four values 0 to 3 [decision]"
outcome = "no value is non-conforming in v1 (receivers accept 0 to 3); dedup is by stream, position and packet index, first valid copy wins, with no separate sequence number"

[[reserved]]
name = "authentication_scheme"
message = "control messages (C-12, placed by 004-16 to 004-18)"
width = 8
value = 0
meaning = "0 (none) in v1 (C-115): wire space for a later authentication scheme"
outcome = "a non-zero scheme is dropped and counted as ReservedNonZero"

[[reserved]]
name = "message_counter"
message = "control messages (C-12, placed by 004-16 to 004-18)"
width = 64
value = "live"
live = true
meaning = "live in v1 because it is the liveness counter (C-115): it increments with every control message and is not a reserved zero field"
outcome = "any value is conforming in v1; the counter is not a reserved zero field and never produces ReservedNonZero"

[[reserved]]
name = "authentication_tag"
message = "control messages (C-12, placed by 004-16 to 004-18)"
width = 128
value = "zero"
meaning = "128 zero bits in v1 (C-115)"
outcome = "a non-zero tag is dropped and counted as ReservedNonZero"
# The protocol version fields (ticket 004-04): see the [versioning] schema
# documentation above. wire.md's "Versioning" section is the authority.

[versioning]
magic = 0x4d4e
magic_width = 2
version_width = 2
major = 1
minor = 0
version = 0x0100

# The one example message (ticket 004-02 Work step 4): a placeholder with two
# fields, so the checker has something to verify. Later tickets (004-06 to
# 004-20) replace this placeholder with the real field tables, one [[message]]
# table per message, in both wire.md and this file.
[[message]]
name = "example"
layer = "control"
dscp = 40
max_size = 4
rejection_reasons = ["TooShort"]

[[message.field]]
name = "flags"
offset = 0
width = 8
type = "u8"
meaning = "example flags byte (placeholder; replaced by the real message tables)"
valid = "0 to 255"

[[message.field]]
name = "sequence"
offset = 8
width = 24
type = "uint"
meaning = "example 24-bit sequence number (placeholder; replaced by the real message tables)"
valid = "0 to 16777215"

# ---------------------------------------------------------------------------
# Media packet header (ticket 004-06) plus slice header (ticket 004-08) plus
# the announcement container (ticket 004-09): the machine-readable copies of
# wire.md's "Media packet header", "Slice header" and "Announcements" field
# tables, which are the human-readable authorities. Appended after the 004-02
# example message, kept separated for merge friendliness.
#
# The [[message]] below declares the packet HEADER, the SLICE HEADER and the
# ANNOUNCEMENT CONTAINER: the slice-header fields continue at bit 128 (byte
# 16) and add BadPacketIndex to this message's rejection reasons, and the
# announcement container continues at bit 304 (byte 38) as a count field plus
# a counted entry region — one 96-bit element per announcement, entries back
# to back, the per-announcement layout that makes an entry of an unknown type
# skippable by its length field (004-04). The element's own field table is
# the [[message]] "announcement" below, a section of this message. 004-10
# (measurement extension) extends this message further and grows its
# declared max_size; 004-13 (checksum) adds BadChecksum to its rejection
# reasons and declares the trailing checksum as a section message. The 9-byte
# measurement extension (ticket 004-10) follows the container; max_size is
# header + slice header + container + extension = 38 + 1 + 4 x 12 + 9 = 96
# bytes [decision]. The 4-byte slice checksum (ticket 004-13) trails the
# content and is declared as its own section message, "slice checksum",
# below; 96 + 4 = 100 bytes, the C-137 cap [decision].
# ---------------------------------------------------------------------------

[[message]]
name = "media packet"
layer = "media"
dscp = 46
max_size = 96
rejection_reasons = ["TooShort", "BadMagic", "VersionMismatch", "ForeignDomain", "UnconfiguredDomain", "UnknownStream", "UnadmittedSource", "WrongEpoch", "BadLength", "BadPacketIndex", "BadChecksum", "ReservedNonZero"]

[[message.field]]
name = "magic"
offset = 0
width = 16
type = "u16"
meaning = "magic 0x4d4e, the ASCII letters M and N, fixed by 004-04"
valid = "0x4d4e only"

[[message.field]]
name = "version"
offset = 16
width = 16
type = "u16"
meaning = "protocol version, major in bits 15..8, minor in bits 7..0; v1 packs 1.0 as 0x0100 (004-04)"
valid = "0x0100 in v1"

[[message.field]]
name = "domain"
offset = 32
width = 16
type = "u16"
meaning = "domain id (C-11); 0 is the unconfigured domain"
valid = "1 to 65535; 0 = unconfigured"

[[message.field]]
name = "stream_number"
offset = 48
width = 16
type = "u16"
meaning = "stream number at the source (C-10); the stream is identified by the source address pinned at admission plus this number, never by a destination (rule 7)"
valid = "0 to 255 (at most 256 streams per source, C-09)"

[[message.field]]
name = "session"
offset = 64
width = 32
type = "u32"
meaning = "session number (C-19): assigned by the source, one per stream, bumped on restart and on timeline-epoch change, and every consumer of a stream sees the same value — a stream property, not a per-receiver field"
valid = "any 32-bit value"

[[message.field]]
name = "timeline_epoch"
offset = 96
width = 16
type = "u16"
meaning = "timeline epoch: the epoch the packet's media-time positions are counted in (C-10)"
valid = "the consumer's current epoch"

[[message.field]]
name = "flags"
offset = 112
width = 8
type = "u8"
meaning = "flags: gap (bit 7), degraded (bit 6; C-122: the flag follows the content), announcement present (bit 5), measurement extension present (bit 4), bits 3..0 reserved"
valid = "bits 3..0 are zero; the other combinations are constrained by wire.md's validity rules"

[[message.field]]
name = "copy_index"
offset = 120
width = 2
type = "uint"
meaning = "copy index (C-07), bits 1..0 of byte 15: wire space for the deferred duplication feature (Reserved fields)"
valid = "0 to 3 in v1: senders emit 0, receivers accept all four values"

[[message.field]]
name = "flags_reserved"
offset = 122
width = 6
type = "uint"
meaning = "reserved, bits 7..2 of byte 15: senders write zero (004-05 general rule)"
valid = "0 only"
reserved = "0"

# Slice header (ticket 004-08): the fields continue the media packet at
# bit 128 (byte 16), offset for offset with wire.md's "Slice header" table,
# which is the human-readable authority.

[[message.field]]
name = "position"
offset = 128
width = 64
type = "u64"
meaning = "position: the content position of the slice's first frame on the domain line — samples at 96 000 Hz (C-01) counted from the domain epoch in the packet header's timeline epoch (C-10); the position half of the dedup key (rule 9)"
valid = "any 64-bit value"

[[message.field]]
name = "frames"
offset = 192
width = 16
type = "u16"
meaning = "frames: how many frames of media time the slice spans"
valid = "1 to 65 535; 48 in the default regime (C-02)"

[[message.field]]
name = "packet_index"
offset = 208
width = 16
type = "u16"
meaning = "packet index: this packet's index within its slice, 0-based"
valid = "0 to packet count − 1 (packet index < packet count)"

[[message.field]]
name = "packet_count"
offset = 224
width = 16
type = "u16"
meaning = "packet count: into how many packets the slice is split"
valid = "1 in the default regime (C-05); 2 to 65 535 in the stamped multi-packet regime"

[[message.field]]
name = "send_timestamp"
offset = 240
width = 64
type = "u64"
meaning = "send timestamp of this packet: 64 bits of nanoseconds of the sender's local monotonic clock (wire.md's Send timestamp)"
valid = "any 64-bit value"

# Announcement container (ticket 004-09): the fields continue the media
# packet at bit 304 (byte 38), offset for offset with wire.md's
# "Announcements" container table, which is the human-readable authority.
# The entry region is one counted field with a 96-bit element per
# announcement, so the entries stay back to back on the wire (an entry of an
# unknown type is skippable by its length field, 004-04); the element's field
# table is the [[message]] "announcement" below.

[[message.field]]
name = "announcement_count"
offset = 304
width = 8
type = "u8"
meaning = "announcement count: how many announcements follow the count field (004-09); the sender sets the flags byte's announcement bit (bit 5) exactly when this is at least 1"
valid = "0 to 4 [decision]"

[[message.field]]
name = "announcement_entry"
offset = 312
width = 96
type = "u128"
count = "announcement_count"
max_count = 4
meaning = "one announcement entry, 12 bytes, laid out as the [[message]] announcement below: type code 1 byte, length 1 byte, position 8 bytes, payload 2 bytes; entries are back to back with no separator, so a same-major receiver skips an entry whose type code it does not know by the entry's length field (004-04)"
valid = "0 to 4 entries (announcement_count), one per announcement kind; each entry as the announcement message lays it out"

# Measurement extension (ticket 004-10): the fields continue the media packet
# after the announcement container, offset for offset with wire.md's
# "Measurement extension" field table, which is the human-readable authority.
# On the wire the extension starts where the container ends, at byte
# 38 + 1 + 12 x count, and is present only when the flags byte's measurement
# bit (bit 4) is set; it is declared here at the container's maximum end,
# bit 696 (byte 87), the same maximum-occupancy model as the counted entry
# region, so the computed max_size covers it [decision].

[[message.field]]
name = "hop_count"
offset = 696
width = 8
type = "u8"
meaning = "hop count: how many processors have forwarded the content since its source, which emits 0; each processor adds 1 when it forwards; saturates at 64, never wraps (004-10)"
valid = "0 to 64 (C-34); 64 is the saturated value, read as 64 or more; above 64 is BadLength"

[[message.field]]
name = "residence_time"
offset = 704
width = 32
type = "u32"
meaning = "accumulated residence time: the sum over the forwarding processors of the time each held the content, in nanoseconds of each processor's local monotonic clock [decision]; saturates at 4 294 967 295, never wraps (004-10)"
valid = "any 32-bit value; 4 294 967 295 is the saturated value"

[[message.field]]
name = "declared_delay"
offset = 736
width = 32
type = "u32"
meaning = "accumulated declared delay: the sum of the forwarding processors' structural latency L, whole samples at the domain rate 96 000 Hz (C-01, C-105); saturates at 4 294 967 295, never wraps (004-10)"
valid = "any 32-bit value; 4 294 967 295 is the saturated value"

# The announcement entry (ticket 004-09): one entry of the media packet's
# announcement container, declared as a section of the media packet message;
# wire.md's per-type tables in the Announcements section are the
# human-readable authority.

[[message]]
name = "announcement"
layer = "media"
dscp = 46
max_size = 12
section_of = "media packet"
rejection_reasons = ["TooShort", "BadLength"]

[[message.field]]
name = "type"
offset = 0
width = 8
type = "u8"
meaning = "type code of the announcement: 0 end-of-stream, 1 re-alignment, 2 timeline epoch switch, 3 transport reference change (004-09)"
valid = "0 to 3 in v1; a same-major receiver skips a value it does not know by length (004-04)"

[[message.field]]
name = "length"
offset = 8
width = 8
type = "u8"
meaning = "length: the announcement's body length in bytes after this field — the length prefix that makes an entry of an unknown type skippable (004-04)"
valid = "10 in v1: the 8-byte position plus the 2-byte payload"

[[message.field]]
name = "position"
offset = 16
width = 64
type = "u64"
meaning = "position: the announcement's named future position — samples at 96 000 Hz (C-01) counted from the domain epoch in the packet header's timeline epoch (C-10), the slice header's position form"
valid = "any 64-bit value; a position at or before the packet's slice position is dropped under BadLength (wire.md, Announcements, Validity rules); the C-43 lead binds only the sender's first issue, so a C-44 re-issue inside it is valid [decision]"

[[message.field]]
name = "payload"
offset = 80
width = 16
type = "u16"
meaning = "payload: the announcement's type-specific payload; in v1 only the epoch switch fills it — the new 16-bit timeline epoch (C-10)"
valid = "the new timeline epoch for type code 2; 0 for type codes 0, 1 and 3 [decision]"

# Slice checksum (ticket 004-13): wire.md's "Checksum" field table is the
# human-readable authority. The checksum trails the content: it is the last
# 4 bytes of the UDP payload of the slice's last packet (packet index =
# packet count - 1), at offset payload length - 4, so it has no fixed offset
# from the packet's start and is declared as a section of the media packet,
# the precedent of the announcement entry; its offset 0 is the checksum's
# own first byte [decision]. Algorithm CRC-32C: width 32, poly 0x1EDC6F41,
# init 0xFFFFFFFF, refin and refout true, xorout 0xFFFFFFFF, check
# 0xE3069283.

[[message]]
name = "slice checksum"
layer = "media"
dscp = 46
max_size = 4
section_of = "media packet"
rejection_reasons = ["BadLength", "BadChecksum"]

[[message.field]]
name = "checksum"
offset = 0
width = 32
type = "u32"
meaning = "slice checksum: CRC-32C of the slice's covered bytes — for each packet in packet-index order, packet header bytes 0 to 13, the flags byte AND 0xC0, slice header bytes 16 to 25, the announcement container and the content region — stored little-endian; the last 4 bytes of the last packet's UDP payload (004-13)"
valid = "any 32-bit value; a value that differs from the recomputed CRC is BadChecksum"

# ---------------------------------------------------------------------------
# Content messages (ticket 004-11): wire.md's "Content messages" field tables
# are the human-readable authority. Every content message starts with the
# 3-byte common header (kind u8, length u16); offsets below are relative to
# the message's own first byte, as for the announcement entry.
#
# None of the three carries section_of. On wire grounds a content message
# belongs to the slice's content, laid over the concatenated content regions
# of its packets, and may continue from one packet into the next, so it is
# not a part of one packet [decision]. The choice is also forced for the
# audio and dense messages: the checker applies the 1 252-byte bound of C-17
# to every message with section_of, and their maximums exceed it. The
# relation is provisional pending a tooling item on that checker rule
# (004-02) [decision].
#
# The sample and value runs are one 4-byte element counted by the length, so
# max_size is the true maximum a parser sizes for: 16 383 elements (65 532
# bytes) under the u16 length; 3 + 65 532 = 65 535 bytes for audio and
# 6 + 65 532 = 65 538 for dense (at the default 48 frames: 65 475 and
# 48 966). The schema has no union type: type = "f32" stands for either
# sample format, f32 or Q1.31, as the stream's manifest declares (004-26).
# ---------------------------------------------------------------------------

[[message]]
name = "content-message header"
layer = "media"
dscp = 46
max_size = 3
rejection_reasons = ["BadLength"]

[[message.field]]
name = "kind"
offset = 0
width = 8
type = "u8"
meaning = "kind: which content message follows; 0 audio, 1 dense controllers, 2 sparse keyed controllers and 3 transport state (laid out by 004-12)"
valid = "0 to 3 in v1; a same-major receiver skips any other value by the length (004-04)"

[[message.field]]
name = "length"
offset = 8
width = 16
type = "u16"
meaning = "length: how many body bytes follow the length field, the common header not included; the prefix that makes a message of an unknown kind skippable"
valid = "0 to 65 535; the body must end inside the content region, else BadLength"

[[message]]
name = "audio message"
layer = "media"
dscp = 46
max_size = 65535
rejection_reasons = ["BadLength"]

[[message.field]]
name = "kind"
offset = 0
width = 8
type = "u8"
meaning = "kind: 0, audio"
valid = "0"

[[message.field]]
name = "length"
offset = 8
width = 16
type = "u16"
meaning = "length: frames x channels x 4, the samples that follow; the channel count is length / (frames x 4) and must equal the manifest's channel map"
valid = "1 152 in a default slice (48 frames x 6 channels x 4); at most 65 535"

[[message.field]]
name = "sample"
offset = 24
width = 32
type = "f32"
count = "length"
max_count = 16383
meaning = "one 4-byte sample, f32 or Q1.31 as the stream's manifest declares (004-26, C-03); the samples run channel by channel, frames x 4 bytes per channel (192 per channel per default slice, C-04), channels in the manifest's channel-map order with no per-channel id byte; the count is length / 4"
valid = "at most 16 383 samples (65 532 bytes); 1 to 341 channels at the default 48 frames"

[[message]]
name = "dense controller message"
layer = "media"
dscp = 46
max_size = 65538
rejection_reasons = ["BadLength"]

[[message.field]]
name = "kind"
offset = 0
width = 8
type = "u8"
meaning = "kind: 1, dense controllers"
valid = "1"

[[message.field]]
name = "length"
offset = 8
width = 16
type = "u16"
meaning = "length: 3 + count x (frames / stride) x 4, the body that follows"
valid = "195 for one controller at one value per frame in a default slice; at most 65 535"

[[message.field]]
name = "count"
offset = 24
width = 8
type = "u8"
meaning = "count: how many dense controllers this message carries, continuing the manifest's controller map from the previous dense message of the slice"
valid = "1 to 255"

[[message.field]]
name = "stride"
offset = 32
width = 16
type = "u16"
meaning = "stride: frames per value; 1 is one value per frame, a larger stride is the stated sub-rate (96 000 / stride values per second)"
valid = "1 to frames, dividing frames"

[[message.field]]
name = "value"
offset = 48
width = 32
type = "f32"
count = "length"
max_count = 16383
meaning = "one 4-byte value in the stream's sample format, f32 or Q1.31 (004-26); the values run controller by controller, (frames / stride) x 4 bytes per controller (192 at one value per frame in a default slice), in controller-map order with no id; no initial-value field (C-158); the count is (length - 3) / 4"
valid = "count x (frames / stride) values, at most 16 383 (65 532 bytes); count at most 255"
