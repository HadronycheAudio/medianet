[[message.field]]
name = "requester_identifier"
offset = 64
width = 64
type = "u64"
meaning = "requester identifier: the requester's module id (C-11), echoed by the reply"
valid = "any 64-bit value; a responder answers only a module that shares an admitted connection with it"

[[message.field]]
name = "send_timestamp"
offset = 128
width = 64
type = "i64"
meaning = "send timestamp: the requester's network time in nanoseconds when it sends the request"
valid = "any 64-bit value"

[[message.field]]
name = "padding"
offset = 192
width = 192
type = "pad"
meaning = "padding: brings the request to the reply's size; senders write zero (004-05 general rule)"
valid = "0 only"
reserved = "0"

[[message]]
name = "one-way probe reply"
layer = "measurement"
dscp = 46
max_size = 48
rejection_reasons = ["TooShort", "BadMagic", "VersionMismatch", "BadLength", "UnconfiguredDomain", "ForeignDomain", "ReservedNonZero", "UnadmittedSource"]

[[message.field]]
name = "magic"
offset = 0
width = 16
type = "u16"
