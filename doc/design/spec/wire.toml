# Manifest (ticket 004-26): the machine-readable copy of wire.md's "Manifest"
# element tables, which are the authority. The manifest is the payload the
# manifest section carries (its manifest_bytes field above): the sections'
# manifest bytes in index order. Its top-level table — a 31-byte fixed part
# (L, cost bound, required E, declared E and seven counts) and seven lists —
# is 18 977 bytes at its maximum counts (31 + 51 x 45 + 8 x 34 + 256 x 15 +
# 255 x 5 + 1 536 x 2 + 1 024 x 4 + 1 024 x 4), above the 1 252-byte bound the
# checker applies to every control-layer message, and it is not a datagram:
# it travels split across manifest sections of at most 1 252 bytes each
# (C-17), 16 at the least for a manifest at its maximum and at most 255, so it
# is declared here through that envelope and its fixed part, not as one
# [[message]]. Its fixed part and its four element tables are declared below
# as their own [[message]] tables, as the hello's elements are; offsets are bits
# from the element's first byte. A manifest that breaks a rule is dropped
# whole and counted once under the named reason. No field is a timer.

# The manifest's 31-byte fixed part, declared as its own [[message]]: the
# rows of wire.md's Manifest layout up to the first counted row. The whole
# manifest (18 977 bytes at its maximum counts) cannot be declared as one
# message by the current schema: wire-check bounds a control message at
# 1 252 bytes and has no notion of a payload joined from several sections;
# the tooling gap is owned by ticket 004-23 (epic close-out, which holds the
