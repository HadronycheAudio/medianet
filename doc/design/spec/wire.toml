[[message.field]]
name = "domain"
offset = 32
width = 16
type = "u16"
meaning = "domain id (C-11); 0 is the unconfigured domain"
valid = "1 to 65535; 0 = unconfigured"

[[message.field]]
name = "message_type"
offset = 48
width = 8
type = "u8"
meaning = "message type, scoped to the measurement layer: 2 = one-way probe request"
valid = "2 only"

[[message.field]]
name = "header_padding"
