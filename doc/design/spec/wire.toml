# The refusal reasons (ticket 004-18, C-185): the closed set of 18, values
# 0 to 17 in C-185's order (the RefuseReason discriminants of 012-01),
# numbered independently of the [[reject]] enumeration; the machine-readable
# copy of wire.md's Admission messages, Refusal reasons table, which is the
# authority; values 18 to 255 are unused. VersionMismatch, ModuleCap and
# NameTaken are raised at discovery and never carried by an admission
# refusal (C-185). The checker does not model this array; checks/004-18.sh
# compares it with wire.md.

[[refusal]]
name = "PortCeiling"
value = 0
meaning = "bit/s on the wire, headers included, above 70 % of either side's interface rate (C-23), per direction for a declared trunk (C-117)"
raised = "admission (005-13, 005-14)"

[[refusal]]
name = "PacketRate"
value = 1
meaning = "declared packets/s above what the receiver accepts (01-architecture.md § 6.2)"
raised = "admission (005-14)"

[[refusal]]
name = "SliceRate"
value = 2
meaning = "declared slice rate above what the receiver accepts (01-architecture.md § 6.2)"
raised = "admission (005-14)"

[[refusal]]
name = "InputCount"
value = 3
meaning = "the receiver's input count would be exceeded, a full connection table included (012-13)"
raised = "admission (012-13)"

[[refusal]]
name = "BufferMemory"
value = 4
meaning = "the alignment rings, sized to A times the rate of the subscribed members (C-96), do not fit the receiver's buffer memory"
raised = "admission (005-14)"

[[refusal]]
name = "CostBound"
