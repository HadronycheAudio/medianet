# Machine-readable wire tables — schema revision 1 (ticket 004-02).
#
# This file is the machine-readable form of the field tables in
# `doc/design/spec/wire.md` (C-130). Task 007 (conformance) generates its test
# vectors from it; tasks 009 to 014 implement the layouts it describes. The
# checker `hadronyche-tools::wire_tables::check_file` (C-133) verifies it in
# CI, unprivileged: parse, round-trip, field coverage, declared versus
# computed maximum size, the 1 252-byte control bound (C-17, C-116), and —
# from ticket 004-03 — that every `rejection_reasons` entry is a member of
# the closed `Reject` enumeration declared below. From ticket 004-05 the
# `[[reserved]]` entries below carry the reserved fields' required v1
# values, which the checker parses and round-trips.
#
# # Schema, revision 1
#
# Top level (the four unit keys are required, exactly these units; the
# optional `reject` array of tables, from ticket 004-03, is the fifth
# top-level key, and the optional `reserved` array of tables, from ticket
# 004-05, is the sixth):
#
#   schema       = 1        integer schema revision; this file is revision 1.
#   offset_unit  = "bits"   every field `offset` is a bit position counted
#                           from bit 0 of the message start.
#   width_unit   = "bits"   every field `width` is a bit count. For a counted
#                           field (see `count`) the width is the width of ONE
#                           element; the field occupies width * max_count bits.
#   size_unit    = "bytes"  every `max_size` is a byte count.
#
# Per rejection reason, one `[[reject]]` table (ticket 004-03), in value
# order; together the entries are the closed `Reject` enumeration of
# wire.md's "Rejection reasons" section:
#
#   name    = "..."   the variant name, unique, non-empty, CamelCase as in
#                     wire.md.
#   value   = N        the variant's u8 value, unique, 0..=255. The values are
#                     stable across minor versions; the enumeration is closed
#                     within a major version, with values 13..=255 reserved
#                     for a future major version [decision].
#   meaning = "..."   the one-line meaning, as in wire.md.
#
# The array is optional (the 004-02 fixtures predate it); the canonical file
# declares it. When present it must declare exactly the closed set pinned by
# the checker, name-for-name and value-for-value — the enumeration is
# closed, so a file cannot redefine it — and every entry of a message's
# `rejection_reasons` must name a member.
#
# Per reserved field, one `[[reserved]]` table (ticket 004-05), in wire.md's
# "Reserved fields" order; together the entries are that section, which is
# the human-readable authority the file must agree with:
#
#   name    = "..."   unique, non-empty field name, as in wire.md.
#   message = "..."   where the field lives (message and the ticket that
#                     places it).
#   width   = N       bit count.
#   value   = ...     the required v1 value: an integer (e.g. 0) or free
#                     text ("zero", "live").
#   live    = true     optional, only for a live field (C-115): the field is
#                     live in v1, not a reserved zero field, so it carries
#                     any value and never produces ReservedNonZero. A live
#                     field cannot also be fixed at 0.
#   meaning = "..."   the required v1 value, as in wire.md.
#   outcome = "..."   the receiver outcome on a non-conforming value.
#
# The array is optional; the canonical file declares it. The general rule of
# wire.md's section is stated here once for the file too: senders zero every
# padding and reserved bit a later ticket adds, and receivers drop and count
# a non-zero value as ReservedNonZero.
#
# Per message, one `[[message]]` table; `name` is unique and non-empty:
#
#   name         = "..."    unique, non-empty message name.
#   layer        = "..."    one of "control", "sync", "media", "measurement".
#   dscp         = N        the DiffServ codepoint, an integer 0..=63.
#   max_size     = N        the declared maximum size in bytes. Every message
#                           has a fixed maximum, because a `no_std` core crate
#                           parses it without allocation and in bounded time
#                           [decision].
#                           (The deprecated spelling `maximum_size` is still
#                           accepted by the parser, but the canonical writer
#                           emits `max_size`, so a file using the deprecated
#                           spelling fails the round-trip check; use
#                           `max_size`.)
#   section_of   = "..."    optional: this message is a section of the named
#                           parent message (the regime stamp is split into
#                           sections that each fit the control bound, C-18).
#   exempt_from_control_bound = "C-116"
#                           optional: the only exemption from the 1 252-byte
#                           control bound, for the path-MTU probe pair, which
#                           is sent at the intended media packet size (C-116).
#                           Any other value is a parse error.
#   rejection_reasons = ["...", ...]
#                           the rejection reasons this message can produce, in
#                           table order. From ticket 004-03 each entry must be
#                           a member of the closed `Reject` enumeration (the
#                           `[[reject]]` tables above); the checker rejects a
#                           file whose message names a non-member.
#
# Per field, one `[[message.field]]` table inside its message; `name` is
# unique within the message, and the fields must cover the message from bit 0
# with no overlap and no undeclared gap (a `type = "pad"` field declares
# padding):
#
#   name     = "..."        unique, non-empty field name.
#   offset   = N            bit position from the message start (bits).
#   width    = N            bit count (bits); the field occupies
#                           [offset, offset + width), or
#                           [offset, offset + width * max_count) when `count`
#                           is present.
#   type     = "..."        one of:
#                             "uint"   sub-byte unsigned integer (e.g. the
#                                      2-bit copy index, C-07);
#                             "u8" "u16" "u32" "u64" "u128"
#                                      fixed-width unsigned integers
#                                      (C-10, C-11, C-12);
#                             "i8" "i16" "i32" "i64" "i128"
#                                      fixed-width signed integers;
#                             "f32"    one 4-byte sample (C-03);
#                             "q1.31"  Q1.31 fixed-point sample;
#                             "pad"    declared padding (zero bits on the
#                                      wire); a pad field is what makes an
#                                      otherwise undeclared gap legal.
#   meaning  = "..."        what the field carries.
#   valid    = "..."        the valid range, free text (e.g. "0 to 255").
#   reserved = "..."        optional: the reserved value, when one exists
#                           (rules for reserved fields are ticket 004-05).
#   count    = "..."        optional: the name of the field that counts this
#                           list; `width` is then per element.
#   max_count = N           required with `count`: the list's fixed maximum
#                           (e.g. at most 32 bundle members, C-08; at most 64
#                           peers, C-34). This is how the maximum message size
#                           is computed from the file alone: the declared
#                           `max_size` must equal the size computed from the
#                           fields and maximum counts, which is why counted
#                           lists are encoded as a count field plus a maximum
#                           count and never as an unbounded list.
#
# The checker runs the rules in this order: parse (from ticket 004-03 this
# includes rejecting any `rejection_reasons` entry that is not a member of
# the `[[reject]]` enumeration; from ticket 004-05 it also parses the
# `[[reserved]]` entries); round-trip (re-serialise, re-parse, compare
# models, reserved entries included); field coverage (overlap, then gap);
# declared versus computed maximum size; and the 1 252-byte control bound
# for control messages and regime stamp sections, with the C-116 exemption.

schema = 1
offset_unit = "bits"
width_unit = "bits"
size_unit = "bytes"

# The closed `Reject` enumeration (ticket 004-03): the machine-readable copy
# of wire.md's "Rejection reasons" section, which is the human-readable
# authority; the two must agree name-for-name and value-for-value. The
# enumeration is closed within a major version, and values 13..=255 are
# reserved for a future major version and stay unused [decision].

[[reject]]
name = "TooShort"
value = 0
meaning = "fewer bytes than the message's fixed minimum: dropped before any field is read"

[[reject]]
name = "BadMagic"
value = 1
meaning = "the leading bytes are not the magic of any message of this major version; the magic is fixed by 004-04"

[[reject]]
name = "VersionMismatch"
value = 2
meaning = "the version field is not the version of this major version: counted like every rejection and also raises a named event (never a silent drop); the version travels in the hello, so the mismatch is found before a connection exists"

[[reject]]
name = "ForeignDomain"
value = 3
meaning = "the domain id is a non-zero domain other than this module's (C-11): dropped and counted"

[[reject]]
name = "UnconfiguredDomain"
value = 4
meaning = "the domain id is 0, the unconfigured domain (C-11): the packet is ignored and counted, not refused, and is never a ForeignDomain (C-173)"

[[reject]]
name = "UnknownStream"
value = 5
meaning = "the stream number names no stream this consumer admits"

[[reject]]
name = "UnadmittedSource"
value = 6
meaning = "the source's module id has no admitted connection at this consumer"

[[reject]]
name = "BadLength"
value = 7
meaning = "a declared length or count disagrees with the message's own size rules: a count above its fixed maximum, or a body that does not fill the fixed size"

[[reject]]
name = "BadChecksum"
value = 8
meaning = "the checksum does not match the recomputed value; the checksum arrives with 004-13"

[[reject]]
name = "BadPacketIndex"
value = 9
meaning = "the packet index lies outside the packet count its slice declares"

[[reject]]
name = "WrongEpoch"
value = 10
meaning = "the timeline epoch is not the consumer's current epoch (C-10): counted under this reason — the per-connection other-epoch counter (C-135, C-159) — and never a miss (C-102)"

[[reject]]
name = "OversizeControl"
value = 11
meaning = "a control message exceeds the 1 252-byte UDP-payload bound (C-17)"

[[reject]]
name = "ReservedNonZero"
value = 12
meaning = "a field this specification fixes at zero carries a non-zero value; the fields and their required zeros are fixed by 004-05"

# Reserved values (ticket 004-05): the machine-readable copy of wire.md's
# "Reserved fields" section, which is the human-readable authority; the two
# must agree. One [[reserved]] entry per reserved field, in wire.md order.

[[reserved]]
name = "copy_index"
message = "media packet header (C-07, placed by 004-06)"
width = 2
value = 0
meaning = "wire space kept for the deferred duplication feature: v1 senders emit 0 only, and v1 receivers accept all four values 0 to 3 [decision]"
outcome = "no value is non-conforming in v1 (receivers accept 0 to 3); dedup is by stream, position and packet index, first valid copy wins, with no separate sequence number"

[[reserved]]
name = "authentication_scheme"
message = "control messages (C-12, placed by 004-16 to 004-18)"
width = 8
value = 0
meaning = "0 (none) in v1 (C-115): wire space for a later authentication scheme"
outcome = "a non-zero scheme is dropped and counted as ReservedNonZero"

[[reserved]]
name = "message_counter"
message = "control messages (C-12, placed by 004-16 to 004-18)"
width = 64
value = "live"
live = true
meaning = "live in v1 because it is the liveness counter (C-115): it increments with every control message and is not a reserved zero field"
outcome = "any value is conforming in v1; the counter is not a reserved zero field and never produces ReservedNonZero"

[[reserved]]
name = "authentication_tag"
message = "control messages (C-12, placed by 004-16 to 004-18)"
width = 128
value = "zero"
meaning = "128 zero bits in v1 (C-115)"
outcome = "a non-zero tag is dropped and counted as ReservedNonZero"

# The one example message (ticket 004-02 Work step 4): a placeholder with two
# fields, so the checker has something to verify. Later tickets (004-06 to
# 004-20) replace this placeholder with the real field tables, one [[message]]
# table per message, in both wire.md and this file.
[[message]]
name = "example"
layer = "control"
dscp = 40
max_size = 4
rejection_reasons = ["TooShort"]

[[message.field]]
name = "flags"
offset = 0
width = 8
type = "u8"
meaning = "example flags byte (placeholder; replaced by the real message tables)"
valid = "0 to 255"

[[message.field]]
name = "sequence"
offset = 8
width = 24
type = "uint"
meaning = "example 24-bit sequence number (placeholder; replaced by the real message tables)"
valid = "0 to 16777215"
